<!DOCTYPE html>
<html lang="en" data-build="courtrush-club-hub-v9">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="courtrush-build" content="club-hub-modal-chat-v9-2026-08-09" />
<meta name="description" content="CourtRush — Rush the court. Rule the game." />
<title>CourtRush</title>
<script>
  (function(){
    try{
      const cached=localStorage.getItem('picklehub_theme');
      const theme=cached==='dark'||cached==='light'?cached:(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
      document.documentElement.dataset.theme=theme;
      document.documentElement.style.colorScheme=theme;
    }catch(_){ document.documentElement.dataset.theme='light'; }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --court:#0E5F58;
    --court-deep:#0A3F3A;
    --court-light:#12786F;
    --ink:#0B2321;
    --bg:#EDF5F2;
    --panel:#FFFFFF;
    --ball:#D6E62B;
    --ball-deep:#A9B818;
    --coral:#EF6351;
    --line:#D7E5E0;
    --muted:#5B7A74;
    --radius:14px;
    --shadow:0 18px 55px rgba(10,63,58,.18);
    --action-fill:#0E5F58;
    --action-hover:#12786F;
    --action-on:#FFFFFF;
    --action-outline:#0E5F58;
    --ball-fill:#D6E62B;
    --ball-hover:#C3D322;
    --ball-on:#0B2321;
    --danger-fill:#C74637;
    --danger-hover:#A9362C;
    --danger-on:#FFFFFF;
    --danger-outline:#B63B30;
    --hero-start:#0E5F58;
    --hero-end:#0A3F3A;
    --court-surface-start:#0E5F58;
    --court-surface-end:#12786F;
    --focus-ring:#6F7A00;
  }
  :root[data-theme="dark"]{
    --court:#2EB7A9;
    --court-deep:#B8F1EA;
    --court-light:#45C8BA;
    --ink:#ECF7F4;
    --bg:#0C1716;
    --panel:#132321;
    --ball:#DCEB45;
    --ball-deep:#C8DA30;
    --coral:#FF806F;
    --line:#29413D;
    --muted:#9CB7B1;
    --shadow:0 18px 60px rgba(0,0,0,.42);
    --action-fill:#39C5B7;
    --action-hover:#69DCD1;
    --action-on:#071B19;
    --action-outline:#72E0D6;
    --ball-fill:#DCEB45;
    --ball-hover:#EEF56E;
    --ball-on:#10211E;
    --danger-fill:#FF8B7C;
    --danger-hover:#FFA79C;
    --danger-on:#2A0F0B;
    --danger-outline:#FF9D91;
    --hero-start:#124B46;
    --hero-end:#082B28;
    --court-surface-start:#17665E;
    --court-surface-end:#0D4B45;
    --focus-ring:#F0F875;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:1180px;margin:0 auto;padding:0 20px 80px;}
  h1,h2,h3{font-family:'Bebas Neue',sans-serif;letter-spacing:0.02em;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  button:focus-visible{outline:3px solid var(--focus-ring);outline-offset:3px;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 0 14px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:42px;height:42px;border-radius:10px;background:var(--court);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 3px 0 var(--court-deep);
  }
  .brand-name{font-size:30px;line-height:1;color:var(--court-deep);}
  .brand-sub{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:2px;}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .account-chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 10px 5px 5px;cursor:pointer;}
  .account-chip:hover{border-color:var(--court);}
  .connection-badge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:5px 8px;background:rgba(14,95,88,.09);color:var(--court);font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
  .connection-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
  .connection-badge.offline{background:rgba(239,99,81,.11);color:var(--coral);}

  .primary-nav{position:relative;}
  .nav-toggle{display:none;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--court-deep);border-radius:9px;padding:9px 11px;font-weight:800;font-size:12px;}
  .nav-toggle-icon{font-size:17px;line-height:1;}
  nav.toolbar{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);}
  nav.toolbar button{position:relative;border:none;background:transparent;padding:12px 11px;font-weight:700;font-size:12.5px;color:var(--muted);transition:all .15s ease;white-space:nowrap;}
  nav.toolbar button::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:transparent;}
  nav.toolbar button.active{color:var(--court-deep);}
  nav.toolbar button.active::after{background:var(--ball-deep);}
  nav.toolbar button:not(.active):hover{color:var(--court);background:rgba(14,95,88,0.05);}
  .nav-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;margin-left:5px;padding:0 5px;border-radius:10px;background:var(--coral);color:#fff;font:800 9px/1 'IBM Plex Mono',monospace;vertical-align:middle;}
  .nav-account{display:flex;align-items:center;gap:8px;}

  /* ---------- Shared date range ---------- */
  .date-range-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:16px;}
  .date-range-copy{min-width:150px;}
  .date-range-copy strong{display:block;font-size:13px;color:var(--court-deep);}
  .date-range-copy span{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
  .date-range-options{display:flex;gap:5px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .date-range-options::-webkit-scrollbar{display:none;}
  .date-range-option{border:none;background:transparent;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;padding:8px 11px;border-radius:7px;white-space:nowrap;}
  .date-range-option.active{background:var(--action-fill);color:var(--action-on);}
  .date-range-option:not(.active):hover{background:#fff;color:var(--court-deep);}
  .exact-date-selector{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px;}
  .exact-date-copy{min-width:170px;}
  .exact-date-copy strong,.exact-date-copy span{display:block;}
  .exact-date-copy strong{font-size:13px;color:var(--court-deep);}
  .exact-date-copy span{font-size:10.5px;color:var(--muted);margin-top:3px;}
  .exact-date-form{display:flex;align-items:flex-end;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
  .exact-date-field{min-width:145px;}
  .exact-date-field label{display:block;margin-bottom:5px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
  .exact-date-field input{width:100%;padding:8px 9px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font:inherit;font-size:12px;}

  /* ---------- Cards / panels ---------- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .panel + .panel{margin-top:16px;}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .section-title h2{font-size:22px;color:var(--court-deep);}
  .eyebrow{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;}

  /* ---------- Hero / scoreboard ---------- */
  .hero{
    background:linear-gradient(135deg,var(--hero-start) 0%,var(--hero-end) 100%);
    border-radius:20px;padding:30px 28px;color:#fff;position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(214,230,43,0.18) 0%,rgba(214,230,43,0) 70%);
  }
  .hero-top{position:relative;z-index:1;}
  .hero h1{font-size:38px;color:#fff;}
  .hero p{margin:6px 0 0;color:rgba(255,255,255,0.75);font-size:14.5px;max-width:520px;}
  .score-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:22px;position:relative;z-index:1;}
  .score-tile{background:rgba(0,0,0,0.18);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:14px 16px;}
  .score-tile .num{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;color:var(--ball);}
  .score-tile .lbl{font-size:11.5px;color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;margin-top:2px;}
  .score-tile .top-club-name{font-family:'Barlow Condensed',sans-serif;font-size:22px;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere;}
  .score-tile .meta{font-size:10.5px;color:rgba(255,255,255,0.62);font-weight:600;margin-top:4px;}

  /* ---------- Leaderboard ---------- */
  .board-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
  .dashboard-board-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  @media(max-width:980px){
    .dashboard-board-grid{grid-template-columns:1fr 1fr;}
    .topbar{align-items:flex-start;gap:12px;flex-wrap:wrap;}
    .topbar-right{width:100%;justify-content:space-between;}
    .nav-toggle{display:flex;}
    nav.toolbar{display:none;position:absolute;left:0;top:44px;z-index:30;width:min(280px,calc(100vw - 40px));padding:7px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(10,63,58,.18);}
    nav.toolbar.open{display:grid;grid-template-columns:1fr;}
    nav.toolbar button{text-align:left;padding:11px 12px;border-radius:8px;}
    nav.toolbar button::after{left:0;right:auto;top:8px;bottom:8px;width:3px;height:auto;border-radius:0 3px 3px 0;}
  }
  @media(max-width:760px){.board-grid{grid-template-columns:1fr;}}
  .board-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);}
  .board-row:last-child{border-bottom:none;}
  .rank{width:22px;font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:13px;}
  .board-name{flex:1;font-weight:600;font-size:14px;}
  .board-sub{font-size:11.5px;color:var(--muted);}
  .diff-pill{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;padding:3px 9px;border-radius:20px;}
  .diff-pos{background:rgba(14,95,88,0.1);color:var(--court);}
  .diff-neg{background:rgba(239,99,81,0.1);color:var(--coral);}
  .diff-zero{background:var(--bg);color:var(--muted);}

  /* ---------- Buttons ---------- */
  .btn{border-radius:9px;padding:10px 16px;font-weight:800;font-size:13.5px;border:none;transition:transform .1s ease,background-color .15s ease,border-color .15s ease,color .15s ease;opacity:1;text-shadow:none;-webkit-text-fill-color:currentColor;}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--action-fill);color:var(--action-on);}
  .btn-primary:hover{background:var(--action-hover);color:var(--action-on);}
  .btn-ball{background:var(--ball-fill);color:var(--ball-on);}
  .btn-ball:hover{background:var(--ball-hover);color:var(--ball-on);}
  .btn-ghost{background:transparent;color:var(--action-outline);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--action-outline);background:rgba(14,95,88,.07);color:var(--action-outline);}
  .btn-danger{background:transparent;color:var(--danger-outline);border:1.5px solid currentColor;}
  .btn-danger:hover{background:rgba(199,70,55,.1);color:var(--danger-outline);}
  .btn-end{background:var(--danger-fill);color:var(--danger-on);}
  .btn-end:hover{background:var(--danger-hover);color:var(--danger-on);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
  .btn:disabled{opacity:.68;cursor:not-allowed;filter:saturate(.72);}
  .btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#243238;border:1.5px solid var(--line);box-shadow:0 1px 2px rgba(11,35,33,.05);}
  .btn-google:hover{border-color:#9eb5ae;background:#fdfefe;}
  .google-mark{width:18px;height:18px;flex:0 0 auto;}
  .auth-divider{display:flex;align-items:center;gap:10px;margin:15px 0;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
  .auth-divider::before,.auth-divider::after{content:"";height:1px;background:var(--line);flex:1;}
  .avatar-frame{position:relative;display:block;flex:0 0 auto;border-radius:50%;overflow:hidden;background:var(--court);}
  .avatar-image{display:block;width:100%;height:100%;object-fit:cover;}
  .avatar-fallback{width:100%;height:100%;align-items:center;justify-content:center;background:var(--court);color:#fff;font-family:'Bebas Neue',sans-serif;}

  /* ---------- Forms ---------- */
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;}
  input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],select,textarea{
    width:100%;padding:10px 11px;border-radius:8px;border:1.5px solid var(--line);
    font-family:'Inter',sans-serif;font-size:14px;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--court-light);outline-offset:1px;border-color:var(--court-light);}
  .field{margin-bottom:14px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .inline-row{display:flex;gap:10px;align-items:flex-end;}
  .inline-row .field{flex:1;margin-bottom:0;}

  /* ---------- Roster table ---------- */
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line);}
  td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover td{background:var(--bg);}
  .name-cell{font-weight:700;}
  .guest-tag{font-size:10px;background:var(--bg);color:var(--muted);padding:2px 7px;border-radius:20px;margin-left:6px;font-weight:700;text-transform:uppercase;}
  .roster-player-cell{display:flex;align-items:center;gap:10px;min-width:180px;}
  .roster-player-name{min-width:0;}
  .mvp-pill{display:inline-flex;align-items:center;justify-content:center;min-width:36px;padding:4px 9px;border-radius:20px;background:var(--ball-fill);color:var(--ball-on);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:800;border:1px solid var(--ball-hover);}
  .mvp-pill.zero{background:var(--bg);border-color:var(--line);color:var(--muted);}
  .roster-toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:12px 14px;margin:0 0 14px;background:var(--bg);border:1px solid var(--line);border-radius:11px;}
  .roster-toolbar-copy{min-width:170px;}
  .roster-toolbar-copy strong{display:block;font-size:13px;color:var(--court-deep);}
  .roster-toolbar-copy span{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
  .roster-sort-controls{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;}
  .roster-sort-control{min-width:145px;}
  .roster-sort-control label{font-size:10px;margin-bottom:4px;}
  .roster-sort-control select{padding:8px 10px;font-size:12.5px;font-weight:700;}
  .roster-club-filter{min-width:220px;}
  .roster-club-menu{position:relative;}
  .roster-club-menu summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:12.5px;font-weight:800;cursor:pointer;list-style:none;}
  .roster-club-menu summary::-webkit-details-marker{display:none;}
  .roster-club-menu summary::after{content:'⌄';font-size:14px;color:var(--muted);transition:transform .15s ease;}
  .roster-club-menu[open] summary{border-color:var(--action-outline);}
  .roster-club-menu[open] summary::after{transform:rotate(180deg);}
  .roster-club-options{position:absolute;right:0;top:calc(100% + 6px);z-index:35;width:max-content;min-width:250px;max-width:min(340px,calc(100vw - 48px));max-height:280px;overflow:auto;padding:9px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);}
  .roster-club-option{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;color:var(--ink);font-size:12px;font-weight:700;text-transform:none;letter-spacing:normal;margin:0;cursor:pointer;}
  .roster-club-option:hover{background:var(--bg);}
  .roster-club-option input{width:16px;height:16px;flex:0 0 auto;accent-color:var(--action-fill);}
  .roster-club-filter-actions{display:flex;gap:7px;padding:7px 4px 2px;border-top:1px solid var(--line);margin-top:4px;}
  .roster-club-filter-actions .btn{flex:1;}
  .roster-sort-header{display:inline-flex;align-items:center;gap:6px;border:none;background:transparent;color:inherit;padding:0;font:inherit;text-transform:inherit;letter-spacing:inherit;font-weight:800;}
  .roster-sort-header:hover,.roster-sort-header.active{color:var(--court);}
  .roster-sort-indicator{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;border-radius:4px;background:var(--bg);font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:1;}
  .roster-sort-header.active .roster-sort-indicator{background:rgba(14,95,88,0.12);color:var(--court);}
  .roster-mobile-cards{display:none;}
  .roster-member-card{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff;}
  .roster-member-head{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;}
  .roster-member-head strong{min-width:0;overflow-wrap:anywhere;}
  .roster-member-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:11px;}
  .roster-member-stat{min-width:0;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 5px;}
  .roster-member-stat strong{display:block;font-family:'IBM Plex Mono',monospace;color:var(--court-deep);font-size:14px;}
  .roster-member-stat span{display:block;margin-top:3px;font-size:8px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800;}

  /* ---------- Club Hub / multi-club ---------- */
  .club-hub-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;background:linear-gradient(135deg,var(--hero-end),var(--hero-start));color:#fff;border-radius:18px;padding:24px;overflow:hidden;position:relative;}
  .club-hub-hero::after{content:"";position:absolute;right:-45px;top:-55px;width:210px;height:210px;border-radius:50%;background:rgba(214,230,43,.12);}
  .club-hub-hero > *{position:relative;z-index:1;}
  .club-hub-hero h1{font-size:36px;}
  .club-hub-hero p{max-width:620px;margin:5px 0 0;color:rgba(255,255,255,.76);font-size:13.5px;line-height:1.5;}
  .club-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px;}
  .club-card{display:flex;flex-direction:column;gap:13px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;text-align:left;min-width:0;cursor:pointer;transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease;}
  .club-card:hover,.club-card:focus-visible{transform:translateY(-2px);border-color:var(--court);box-shadow:0 8px 22px rgba(10,63,58,.09);outline:none;}
  .club-card.active{border-color:var(--court);box-shadow:0 0 0 2px rgba(14,95,88,.08);}
  .club-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .club-card h2{font-size:23px;color:var(--court-deep);overflow-wrap:anywhere;}
  .club-origin{display:flex;gap:7px;align-items:flex-start;color:var(--muted);font-size:12px;line-height:1.45;overflow-wrap:anywhere;}
  .club-card-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .club-card-metric{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px;}
  .club-card-metric strong{display:block;font-family:'IBM Plex Mono',monospace;color:var(--court-deep);font-size:16px;}
  .club-card-metric span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:2px;font-weight:800;}
  .club-members-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;}
  .club-member-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;min-width:0;}
  .club-member-row-copy{min-width:0;flex:1;}
  .club-member-row-copy strong{display:block;overflow-wrap:anywhere;}
  .club-member-row-copy span{display:block;font-size:10px;color:var(--muted);margin-top:2px;}
  .club-profile-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0;}
  .club-profile-toolbar{display:flex;justify-content:flex-end;margin:16px 0 10px;}
  .club-profile-stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;}
  .club-profile-stat strong{display:block;color:var(--court-deep);font:700 20px/1 'IBM Plex Mono',monospace;}
  .club-profile-stat span{display:block;margin-top:5px;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;}
  .club-leaderboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin:10px 0 16px;}
  .club-leader{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;text-align:left;cursor:pointer;}
  .club-leader:hover{border-color:var(--court);}
  .club-leader-rank{display:flex;align-items:center;justify-content:center;width:28px;height:28px;flex:0 0 auto;border-radius:50%;background:var(--hero-end);color:#fff;font:700 11px 'IBM Plex Mono',monospace;}
  .club-leader-copy{min-width:0;flex:1;}
  .club-leader-copy strong,.club-leader-copy span{display:block;}
  .club-leader-copy strong{overflow-wrap:anywhere;}
  .club-leader-copy span{font-size:10px;color:var(--muted);margin-top:2px;}
  .club-request-list{display:grid;gap:8px;margin-top:10px;}
  .club-request{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid rgba(239,99,81,.22);background:rgba(239,99,81,.045);border-radius:10px;}
  .club-request-copy{min-width:0;flex:1;}
  .club-request-copy strong,.club-request-copy span{display:block;}
  .club-request-copy span{font-size:10px;color:var(--muted);margin-top:2px;}
  .club-request-actions{display:flex;gap:7px;flex-wrap:wrap;}
  .club-admin-panel{margin-top:14px;padding:14px;background:rgba(14,95,88,.055);border:1px solid rgba(14,95,88,.16);border-radius:11px;}
  .club-danger-zone{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:14px;padding:13px;border:1px solid rgba(239,99,81,.24);background:rgba(239,99,81,.055);border-radius:10px;}
  .club-danger-zone strong,.club-danger-zone span{display:block;}
  .club-danger-zone span{font-size:11px;color:var(--muted);margin-top:3px;max-width:620px;}
  .club-chip-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}
  .club-chip{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:5px 9px;background:var(--bg);border:1px solid var(--line);color:var(--court-deep);font-size:11px;font-weight:800;}
  .club-chip.admin{background:rgba(214,230,43,.22);border-color:rgba(169,184,24,.38);}
  .club-chip.no-club{background:transparent;border-style:dashed;color:var(--muted);}
  .club-membership-option{display:flex;align-items:flex-start;gap:9px;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;text-transform:none;letter-spacing:normal;margin-bottom:0;font-size:inherit;color:inherit;}
  .club-membership-option + .club-membership-option{margin-top:7px;}
  .club-membership-option input{margin-top:3px;flex:0 0 auto;}
  .club-membership-option strong,.club-membership-option span{display:block;}
  .club-membership-option span{font-size:10px;color:var(--muted);margin-top:2px;}
  .profile-setting.profile-clubs{grid-column:1/-1;}
  .h2h-filter-grid{display:grid;grid-template-columns:minmax(190px,.7fr) 1fr 1fr;gap:12px;align-items:end;}
  .h2h-player-strip{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin-top:14px;}
  .h2h-player-card{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px;min-width:0;}
  .h2h-player-card-copy{min-width:0;}
  .h2h-player-card strong{display:block;color:var(--court-deep);font-size:15px;overflow-wrap:anywhere;}
  .h2h-player-card span{display:block;color:var(--muted);font-size:10px;margin-top:3px;}
  .h2h-versus{display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;color:var(--court);font-size:20px;}
  .h2h-series-callout{margin-top:14px;padding:12px 14px;border-radius:10px;background:rgba(214,230,43,.18);border:1px solid rgba(169,184,24,.32);color:var(--court-deep);font-weight:700;font-size:13px;}

  /* ---------- Empty state ---------- */
  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty h3{color:var(--ink);font-size:20px;margin-bottom:6px;}
  .empty p{font-size:14px;margin:0 0 16px;}

  /* ---------- Paddle icon / stack (signature element) ---------- */
  .paddle{display:inline-flex;vertical-align:middle;}
  .paddle-stack{display:flex;flex-direction:column;gap:8px;}
  .paddle-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border-radius:9px;border:1px solid var(--line);}
  .paddle-row .p-order{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);width:18px;}
  .paddle-row .p-name{font-weight:600;font-size:13.5px;flex:1;}

  /* ---------- Court diagram ---------- */
  .court-card{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px;}
  .court-head{background:var(--hero-end);color:#fff;padding:8px 14px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.05em;display:flex;justify-content:space-between;align-items:center;}
  .court-body{background:linear-gradient(180deg,var(--court-surface-start) 0%,var(--court-surface-end) 100%);padding:16px 14px;}
  .team-row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.12);border-radius:9px;padding:10px 12px;color:#fff;font-weight:600;font-size:14px;}
  .team-row + .team-row{margin-top:0;}
  .net-line{display:flex;align-items:center;gap:8px;margin:8px 0;color:rgba(255,255,255,0.6);font-size:10px;text-transform:uppercase;letter-spacing:0.18em;font-weight:700;}
  .net-line::before,.net-line::after{content:"";flex:1;height:1px;background:repeating-linear-gradient(90deg,rgba(255,255,255,0.5) 0 6px,transparent 6px 12px);}
  .score-inputs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;}
  .score-inputs input{width:64px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:700;}
  .score-vs{color:rgba(255,255,255,0.6);font-size:12px;font-weight:700;}
  .recorded-badge{background:var(--ball-fill);color:var(--ball-on);font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;}
  .btn-score-edit{background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.45);}
  .btn-score-edit:hover{background:rgba(255,255,255,0.22);border-color:#fff;}
  .team-names{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0;}
  .team-separator{color:rgba(255,255,255,0.72);font-weight:700;}
  .player-name-self{display:inline-flex;align-items:center;gap:5px;background:var(--ball-fill);color:var(--ball-on);padding:3px 7px;border-radius:7px;font-weight:800;box-shadow:0 0 0 1px rgba(255,255,255,0.35);}
  .player-you-tag{font-size:8px;line-height:1;letter-spacing:0.08em;text-transform:uppercase;background:var(--hero-end);color:#fff;padding:3px 4px;border-radius:4px;}
  .paddle-row.self-player{background:rgba(214,230,43,0.22);border-color:rgba(169,184,24,0.55);}
  .paddle-row .player-name-self{box-shadow:none;}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,30,27,0.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .modal{background:var(--panel);border-radius:16px;max-width:640px;width:100%;padding:24px;position:relative;}
  .modal-close{position:absolute;top:16px;right:16px;background:var(--bg);border:none;width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--muted);font-weight:700;}
  .modal-close:hover{background:var(--line);}

  /* ---------- Chips / checkboxes ---------- */
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1.5px solid var(--line);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;background:#fff;}
  .chip.on{background:var(--action-fill);border-color:var(--action-fill);color:var(--action-on);}
  .chip .cnt{opacity:0.7;font-size:11px;margin-left:4px;}

  /* ---------- Toast ---------- */
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:9px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s ease;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,0.2);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .muted{color:var(--muted);}
  .small{font-size:12.5px;}
  .flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .divider{height:1px;background:var(--line);margin:16px 0;}
  .round-label{display:inline-flex;align-items:center;gap:6px;font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--court-deep);letter-spacing:0.03em;margin:22px 0 10px;}
  .round-label:first-child{margin-top:4px;}
  .link-btn{background:none;border:none;color:var(--court);font-weight:700;font-size:13px;padding:0;text-decoration:underline;}

  /* ---------- Play mode picker ---------- */
  .mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
  .mode-card{border:1.5px solid var(--line);border-radius:14px;padding:18px;text-align:left;background:#fff;cursor:pointer;transition:all .15s ease;}
  .mode-card:hover{border-color:var(--court);transform:translateY(-1px);}
  .mode-card .mtitle{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--court-deep);letter-spacing:0.02em;}
  .mode-card .mdesc{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.4;}
  .mode-badge{display:inline-flex;align-items:center;gap:6px;background:var(--hero-end);color:#fff;font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;padding:5px 12px;border-radius:20px;}
  .team-stage-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg);border-radius:9px;border:1px solid var(--line);font-size:13.5px;font-weight:600;}
  .team-stage-row + .team-stage-row{margin-top:6px;}


  /* ---------- Schedule foundation ---------- */
  .schedule-page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .schedule-page-head h1{font-size:34px;color:var(--court-deep);line-height:1;}
  .schedule-page-head p{margin:6px 0 0;max-width:620px;}
  .schedule-filters{display:flex;gap:6px;overflow-x:auto;padding:5px;background:var(--bg);border:1px solid var(--line);border-radius:11px;-webkit-overflow-scrolling:touch;}
  .schedule-filters::-webkit-scrollbar{display:none;}
  .schedule-filter{border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;padding:9px 14px;border-radius:8px;white-space:nowrap;}
  .schedule-filter.active{background:var(--action-fill);color:var(--action-on);}
  .game-plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;}
  .game-plan-card{border:1.5px solid var(--line);border-radius:15px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:14px;min-width:0;}
  .game-plan-card:hover{border-color:rgba(14,95,88,0.55);box-shadow:0 8px 24px rgba(10,63,58,0.07);}
  .game-plan-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .game-plan-date{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;}
  .game-plan-time{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--court-deep);line-height:1;margin-top:4px;}
  .game-plan-title{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--ink);line-height:1.05;}
  .game-plan-creator{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .game-plan-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .game-plan-metric{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;}
  .game-plan-metric strong{display:block;font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--court-deep);}
  .game-plan-metric span{display:block;font-size:10px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
  .game-plan-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;}
  .status-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.07em;border-radius:20px;padding:5px 9px;background:var(--bg);color:var(--muted);}
  .status-badge.published,.status-badge.in_progress{background:rgba(14,95,88,0.1);color:var(--court);}
  .status-badge.completed{background:var(--ball-fill);color:var(--ball-on);}
  .status-badge.cancelled{background:rgba(239,99,81,0.1);color:var(--coral);}
  .builder-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,0.75fr);gap:16px;align-items:start;}
  .builder-sticky{position:sticky;top:12px;}
  .builder-section{padding:16px 0;border-top:1px solid var(--line);}
  .builder-section:first-of-type{border-top:none;padding-top:0;}
  .selection-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .plan-preview{background:linear-gradient(145deg,var(--hero-end),var(--hero-start));border-radius:15px;padding:20px;color:#fff;overflow:hidden;position:relative;}
  .plan-preview::after{content:"";position:absolute;right:-45px;top:-45px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(214,230,43,0.22),rgba(214,230,43,0));}
  .plan-preview > *{position:relative;z-index:1;}
  .plan-preview h2{font-size:27px;color:#fff;}
  .preview-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px;}
  .preview-metric{background:rgba(0,0,0,0.17);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:11px;}
  .preview-metric strong{display:block;font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--ball);}
  .preview-metric span{font-size:10px;text-transform:uppercase;letter-spacing:0.07em;font-weight:700;color:rgba(255,255,255,0.68);}
  .preview-finish{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.16);display:flex;justify-content:space-between;gap:10px;align-items:center;}
  .preview-finish strong{font-family:'IBM Plex Mono',monospace;color:var(--ball);}
  .plan-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-top:16px;}
  .plan-summary-item{padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;}
  .plan-summary-item strong{font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--court-deep);display:block;}
  .plan-summary-item span{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);}
  .participant-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
  .participant-pill{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:6px 10px;font-size:12px;font-weight:700;}
  .form-note{border-left:3px solid var(--ball-deep);background:rgba(214,230,43,0.12);padding:10px 12px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--muted);}
  .court-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
  .schedule-filter-tools{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;}
  .court-count-filter{min-width:190px;margin-left:auto;}
  .court-count-filter label{margin-bottom:4px;}
  .court-board-filter{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;}
  .court-board-filter .field{margin:0;min-width:170px;}
  .ended-note{margin-top:16px;padding:12px 14px;border-radius:10px;background:rgba(239,99,81,0.08);border:1px solid rgba(239,99,81,0.25);color:var(--ink);font-size:12.5px;line-height:1.45;}
  .ended-note strong{color:var(--coral);}
  .history-plan-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .history-plan-head h2{font-size:25px;color:var(--court-deep);margin-top:8px;}
  .history-plan-meta{font-size:12.5px;color:var(--muted);margin:5px 0 0;}
  .history-plan-summary{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .history-mvp{margin-top:12px;padding:11px 12px;border-radius:10px;background:rgba(214,230,43,0.12);border:1px solid rgba(169,184,24,0.28);}
  .history-mvp.empty{background:var(--bg);border-color:var(--line);}
  .history-mvp-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);}
  .history-mvp-names{font-weight:800;color:var(--court-deep);margin-top:4px;line-height:1.45;}
  .history-mvp-detail{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .history-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:14px;}
  .history-legacy-note{font-size:11px;color:var(--muted);margin-top:6px;}

  /* ---------- Responsive player profile ---------- */
  body.modal-open{overflow:hidden;}
  .player-profile-overlay{overscroll-behavior:contain;}
  .player-profile-modal{max-width:760px;overflow-x:hidden;}
  .player-profile-sticky-actions{
    position:sticky;top:0;z-index:8;height:0;
    display:flex;justify-content:flex-end;pointer-events:none;
  }
  .player-profile-sticky-actions .modal-close{
    position:relative;top:-4px;right:-4px;pointer-events:auto;
    box-shadow:0 3px 12px rgba(10,63,58,0.14);
  }
  .player-profile-header{display:flex;align-items:center;gap:14px;padding-right:40px;min-width:0;}
  .player-profile-header-copy{min-width:0;}
  .player-profile-header-copy h2{overflow-wrap:anywhere;}
  .player-profile-modal .score-tiles{grid-template-columns:repeat(auto-fit,minmax(125px,1fr));}
  .player-profile-modal .score-tile{min-width:0;}
  .profile-section{min-width:0;}
  .profile-history-range{margin-top:16px;}
  .my-profile-page{min-width:0;}
  .my-profile-hero{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;background:linear-gradient(135deg,var(--hero-start) 0%,var(--hero-end) 100%);color:#fff;border-radius:18px;padding:24px;}
  .my-profile-person{display:flex;align-items:center;gap:14px;min-width:0;}
  .my-profile-person-copy{min-width:0;}
  .my-profile-person h1{font-size:34px;overflow-wrap:anywhere;}
  .my-profile-person p{margin:5px 0 0;color:rgba(255,255,255,.72);font-size:13px;}
  .my-profile-badge{display:inline-flex;background:var(--ball-fill);color:var(--ball-on);border-radius:20px;padding:6px 11px;font-size:11px;font-weight:800;white-space:nowrap;}
  .my-profile-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .btn-profile-edit{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.38);}
  .btn-profile-edit:hover{background:rgba(255,255,255,.2);border-color:#fff;}
  .profile-name-editor{width:100%;display:flex;align-items:flex-end;gap:9px;margin-top:14px;padding:12px;background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.2);border-radius:11px;}
  .profile-name-editor .field{flex:1;margin:0;}
  .profile-name-editor label{color:rgba(255,255,255,.7);}
  .profile-kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px;}
  .profile-kpi{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .profile-kpi-value{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:800;color:var(--court-deep);overflow-wrap:anywhere;}
  .profile-kpi-label{margin-top:4px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;}

function isSuperAdmin(){ return !!(state.currentUser&&state.currentUser.role==='admin'); }
function isClubAdmin(clubId){
  if(!state.currentUser||!clubId) return false;
  return state.adminClubIds.includes(clubId) ||
    (state.currentUser.role==='club_admin'&&(state.currentUser.clubId||ACTIVE_CLUB_ID)===clubId);

function isAdmin(){ return isSuperAdmin()||isAnyClubAdmin(); }
function isAdminForClub(clubId){ return isSuperAdmin()||isClubAdmin(clubId||ACTIVE_CLUB_ID); }
function canClearClubChat(clubId){ return !!(clubId&&(isSuperAdmin()||isClubAdmin(clubId)||isClubStaff(clubId))); }
function isSignedIn(){ return !!state.currentUser; }

function clubMembershipId(clubId,playerId){ return `${clubId}_${playerId}`; }
function clubAdminId(clubId,uidValue){ return `${clubId}_${uidValue}`; }
function normalizedClubRecords(){
  const unique=new Map();
  [...state.clubs].forEach(c=>{
    const id=c.id||c.docId;
    if(id) unique.set(id,{...unique.get(id),...c,id});
  });
  return [...unique.values()];
}
function clubsForDisplay(){
  const records=normalizedClubRecords();
  const clubs=records.filter(c=>c.status!=='removed');
  if(!records.some(c=>c.id===ACTIVE_CLUB_ID)) clubs.unshift({...LEGACY_CLUB});
  return clubs.sort((a,b)=>(a.name||'').localeCompare(b.name||'',undefined,{sensitivity:'base'}));
}
function clubRecordById(clubId){
  const record=normalizedClubRecords().find(c=>c.id===clubId);
  if(record) return record;
  return clubId===ACTIVE_CLUB_ID?{...LEGACY_CLUB}:null;
}
function clubById(clubId){
  const club=clubRecordById(clubId);
  return club&&club.status!=='removed'?club:null;
}
function clubName(clubId){ const club=clubRecordById(clubId); return club?club.name:'Independent'; }
function playerClubIds(player){
  if(!player) return [];
  const ids=new Set(Array.isArray(player.clubIds)?player.clubIds.filter(Boolean):[]);
  if(player.clubId) ids.add(player.clubId);
  state.clubMemberships.filter(m=>m.playerId===player.id).forEach(m=>{
    if(m.status==='active') ids.add(m.clubId);
    else ids.delete(m.clubId);
  });
  return [...ids];
}
function clubMembershipRecord(clubId,playerId){
  return state.clubMemberships.find(m=>m.clubId===clubId&&m.playerId===playerId)||null;
}
function pendingJoinRequest(clubId,playerId){
  const record=clubMembershipRecord(clubId,playerId);
  return record&&record.status==='pending'?record:null;
}
function pendingJoinRequestsForClub(clubId){
  return state.clubMemberships.filter(m=>m.clubId===clubId&&m.status==='pending');
}
function pendingManagedJoinRequestCount(){
  const managed=new Set(managedClubIds());
  return state.clubMemberships.filter(m=>m.status==='pending'&&managed.has(m.clubId)&&!!clubById(m.clubId)).length;
}
function activePlayerClubIds(player){ return playerClubIds(player).filter(id=>!!clubById(id)); }
function playerIsMemberOfClub(player,clubId){ return !!(player&&clubId&&clubById(clubId)&&playerClubIds(player).includes(clubId)); }
function membersForClub(clubId){ return state.players.filter(p=>playerIsMemberOfClub(p,clubId)).sort((a,b)=>a.name.localeCompare(b.name)); }
function myClubIds(){
  const player=state.players.find(p=>p.id===state.myPlayerId);
  return activePlayerClubIds(player);
}
function managedClubIds(){
  if(isSuperAdmin()) return clubsForDisplay().map(c=>c.id);
  const ids=new Set(state.adminClubIds);
  if(state.currentUser&&state.currentUser.role==='club_admin') ids.add(state.currentUser.clubId||ACTIVE_CLUB_ID);
  return [...ids];
}
function chatClubIds(){
  return [...new Set([...myClubIds(),...managedClubIds(),...state.staffClubIds])].filter(id=>!!clubById(id));
}
function clubRoleRecord(clubId,playerId){
  return state.clubRoles.find(role=>role.clubId===clubId&&role.playerId===playerId)||null;
}
function clubRoleForPlayer(clubId,player){
  if(!player) return 'member';
  const role=clubRoleRecord(clubId,player.id);
  return role&&['club_admin','co_admin','staff'].includes(role.role)?role.role:'member';
}
function clubRoleLabel(role){
  return role==='club_admin'?'Club Admin':role==='co_admin'?'Co-Admin':role==='staff'?'Staff':'Member';
}
function canAssignClubRoles(clubId){
  if(isSuperAdmin()) return true;
  if(!state.currentUser) return false;
  const mine=state.clubRoles.find(role=>role.clubId===clubId&&role.uid===state.currentUser.uid);
  return !!(mine&&mine.role==='club_admin') || (state.currentUser.role==='club_admin'&&(state.currentUser.clubId||ACTIVE_CLUB_ID)===clubId);
}
function themeValue(){ return document.documentElement.dataset.theme==='dark'?'dark':'light'; }
function toggleTheme(){
  const next=themeValue()==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next;
  document.documentElement.style.colorScheme=next;

/* Schedule reads are scoped to the active landing filter. Today/Upcoming share
   one future-plans query; My Created uses an owner query. Leaving Schedule
   unsubscribes so the app does not keep downloading schedule changes needlessly. */
let scheduleUnsub=null;
let scheduleSyncKey=null;
function stopScheduleSync(){
  if(scheduleUnsub){ scheduleUnsub(); scheduleUnsub=null; }
  scheduleSyncKey=null;
}
function refreshScheduleSync(force){
  if(state.tab!=='schedule'){ stopScheduleSync(); return; }
  if(!state.currentUser){
    stopScheduleSync();
    state.schedules=[];
    return;
  }
  if(typeof SCHEDULES_COL.where!=='function') return;
  const mine=state.scheduleFilter==='mine';
  const dates=state.scheduleFilter==='dates';
  const bounds=dateRangeBounds(state.dateRange);
  const key=mine?`mine:${state.currentUser.uid}`:dates?`dates:${bounds.start||''}:${bounds.end||''}`:`future:${state.currentUser?state.currentUser.uid:'guest'}:${todayStr()}`;
  if(!force&&scheduleUnsub&&scheduleSyncKey===key) return;
  stopScheduleSync();
  scheduleSyncKey=key;
  const source=mine
    ? SCHEDULES_COL.where('createdBy','==',state.currentUser.uid)
    : dates
      ? (bounds.start?SCHEDULES_COL.where('date','>=',bounds.start):SCHEDULES_COL.where('date','<=',bounds.end||todayStr()))
      : SCHEDULES_COL.where('date','>=',todayStr());
  scheduleUnsub=source.onSnapshot(snap=>{
    state.schedules=snap.docs.map(d=>normalizeScheduleDoc(d.id,d.data()));
    state.connected=true;
    render();
  },err=>{
    console.error(err);
    stopScheduleSync();
    state.schedules=[];
    state.connected=false;
    toast('Could not load Game Plans — check your connection or Firestore rules');
    render();
  });
}

let clubAdminUnsub=null;
let clubRoleUnsubs=[];
let clubRoleSyncKey='';
function stopClubRoleDirectorySync(){ clubRoleUnsubs.forEach(unsub=>unsub()); clubRoleUnsubs=[]; clubRoleSyncKey=''; state.clubRoles=[]; }
function refreshClubRoleDirectorySync(force){
  if(!state.currentUser){ stopClubRoleDirectorySync(); return; }
  const clubIds=[...new Set([...myClubIds(),...managedClubIds()])].filter(Boolean).sort();
  const key=clubIds.join('|');
  if(!force&&clubRoleUnsubs.length&&clubRoleSyncKey===key) return;
  stopClubRoleDirectorySync();
  clubRoleSyncKey=key;
  const byClub=new Map();
  clubIds.forEach(clubId=>{
    const unsub=CLUB_ADMINS_COL.where('clubId','==',clubId).onSnapshot(snap=>{
      byClub.set(clubId,snap.docs.map(doc=>({id:doc.id,...doc.data()})));
      state.clubRoles=[...byClub.values()].flat();
      render();
    },err=>console.error(`Club role sync failed for ${clubId}`,err));
    clubRoleUnsubs.push(unsub);
  });
}
function refreshClubAdminSync(){
  if(clubAdminUnsub){ clubAdminUnsub(); clubAdminUnsub=null; }
  state.adminClubIds=[];
  state.staffClubIds=[];
  if(!state.currentUser||typeof CLUB_ADMINS_COL.where!=='function') return;
  clubAdminUnsub=CLUB_ADMINS_COL.where('uid','==',state.currentUser.uid).onSnapshot(snap=>{
    const roles=snap.docs.map(d=>d.data());
    state.adminClubIds=[...new Set(roles.filter(role=>!role.role||role.role==='club_admin'||role.role==='co_admin').map(role=>role.clubId).filter(Boolean))];
    state.staffClubIds=[...new Set(roles.filter(role=>role.role==='staff').map(role=>role.clubId).filter(Boolean))];
    refreshClubRoleDirectorySync(true);
    refreshChatSync(true);
    render();
  },err=>console.error('Club admin sync failed',err));
}

let chatUnsubs=[];
let chatSyncKey='';
function stopChatSync(){ chatUnsubs.forEach(unsub=>unsub()); chatUnsubs=[]; chatSyncKey=''; state.chatMessages=[]; }
function refreshChatSync(force){
  if(state.tab!=='chat'||!state.currentUser||!state.myPlayerId){ stopChatSync(); return; }
  const clubIds=chatClubIds().sort();
  const key=clubIds.join('|');
  if(!force&&chatUnsubs.length&&chatSyncKey===key) return;
  stopChatSync();
  chatSyncKey=key;
  if(!clubIds.length){ state.chatClubId=null; render(); return; }
  if(!clubIds.includes(state.chatClubId)) state.chatClubId=clubIds[0];
  const byClub=new Map();
  clubIds.forEach(clubId=>{
    const unsub=CLUB_CHATS_COL.where('clubId','==',clubId).onSnapshot(snap=>{
      byClub.set(clubId,snap.docs.map(doc=>({id:doc.id,...doc.data()})));
      state.chatMessages=[...byClub.values()].flat().sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||''))).slice(-500);
      render();
    },err=>{ console.error('Club chat sync failed',err); toast(`Could not load ${clubName(clubId)} chat`); });
    chatUnsubs.push(unsub);
  });
}

offlinePersistenceReady.then(()=>auth.onAuthStateChanged(user=>{
  if(userDocUnsub){ userDocUnsub(); userDocUnsub=null; }
  if(!user){
    state.currentUser = null;

    refreshClubRoleDirectorySync(true);

/* ============================= SCHEDULE MATH ============================= */
// So every player partners with (and faces) every other player exactly once,
// classic round-robin "circle method" needs N-1 rounds for even N, N rounds for odd N (one bye/sit-out each round).
function autoRoundCount(n){
  if(n < 2) return 0;
  return (n % 2 === 0) ? (n - 1) : n;
}


/* ============================= HELPERS ============================= */
function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function localDateStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayStr(){ return localDateStr(new Date()); }
function fmtDate(s){ const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function dateRangeBounds(range){
  const key=range==='custom'?'custom':(DATE_RANGE_META[range]?range:'overall');
  if(key==='custom'){
    const start=/^\d{4}-\d{2}-\d{2}$/.test(state.customDateStart||'')?state.customDateStart:null;
    const end=/^\d{4}-\d{2}-\d{2}$/.test(state.customDateEnd||'')?state.customDateEnd:null;
    return {start,end};
  }
  if(key==='overall') return {start:null,end:null};
  const now=new Date();
  let start,end;
  if(key==='year'){
    start=new Date(now.getFullYear(),0,1);
    end=new Date(now.getFullYear(),11,31);
  }else if(key==='month'){
    start=new Date(now.getFullYear(),now.getMonth(),1);
    end=new Date(now.getFullYear(),now.getMonth()+1,0);
  }else{
    const mondayOffset=(now.getDay()+6)%7;
    start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-mondayOffset);
    end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+6);
  }
  return {start:localDateStr(start),end:localDateStr(end)};
}
function dateInActiveRange(dateStr){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(dateStr||''))) return false;
  const {start,end}=dateRangeBounds(state.dateRange);
  if(!start&&!end) return true;
  return (!start||dateStr>=start)&&(!end||dateStr<=end);
}
function activeDateRangeLabel(){
  if(state.dateRange==='custom'){
    const {start,end}=dateRangeBounds('custom');
    if(start&&end&&start===end) return fmtDate(start);
    return 'Selected Dates';
  }
  return (DATE_RANGE_META[state.dateRange]||DATE_RANGE_META.overall).label;
}
function activeDateRangeSummary(){
  const {start,end}=dateRangeBounds(state.dateRange);
  if(!start&&!end) return 'All dates';
  if(start&&!end) return `From ${fmtDate(start)}`;
  if(!start&&end) return `Through ${fmtDate(end)}`;
  if(start===end) return fmtDate(start);
  return `${fmtDate(start)} – ${fmtDate(end)}`;
}
function resetDateFilteredViews(){
  state.historyGroupKey=null;
  if(state.tab==='schedule'&&state.scheduleScreen==='view'){
    state.scheduleScreen='list';
    state.activeScheduleId=null;

}

  state.customDateEnd='';
  resetDateFilteredViews();
  render();
}
function applyCustomDateRange(ev){
  if(ev) ev.preventDefault();
  const startEl=document.getElementById('customDateStart');
  const endEl=document.getElementById('customDateEnd');
  const start=startEl?startEl.value:'';
  const end=endEl?endEl.value:'';
  if(!start&&!end){ toast('Choose a start date, an end date, or both'); return; }
  if(start&&end&&start>end){ toast('The start date must be on or before the end date'); return; }
  state.customDateStart=start;
  state.customDateEnd=end;
  state.dateRange='custom';
  resetDateFilteredViews();
  if(state.tab==='schedule'){
    state.scheduleFilter='dates';
    state.scheduleCourtFilter='all';
    refreshScheduleSync(true);
  }
  render();
}

    state.scheduleFilter='today';
    state.scheduleCourtFilter='all';
    refreshScheduleSync(true);
  }
  render();
}
function matchVerificationStatus(match){
  const value=match&&match.verificationStatus;
  return value==='pending'||value==='disputed'||value==='confirmed'?value:'confirmed';
}
function isOfficialMatch(match){ return matchVerificationStatus(match)==='confirmed'; }
function recordedMatchesInActiveRange(){
  return state.matches.filter(m=>(!m.status||m.status==='completed')&&dateInActiveRange(m.date));
}
function completedMatchesInActiveRange(){
  return recordedMatchesInActiveRange().filter(isOfficialMatch);
}
function verificationBadge(match){
  const status=matchVerificationStatus(match);
  const label=status==='confirmed'?'Confirmed':status==='disputed'?'Disputed':'Pending confirmation';
  return `<span class="verification-badge ${status}">${label}</span>`;
}
const actionCooldownUntil=new Map();
function allowAction(key, milliseconds){
  const now=Date.now();
  if((actionCooldownUntil.get(key)||0)>now){ toast('Please wait a moment before trying that again'); return false; }
  actionCooldownUntil.set(key,now+Math.max(500,Number(milliseconds)||1500));
  return true;
}
function resultReviewActions(match){
  const status=matchVerificationStatus(match);
  const mayReview=canReviewMatch(match)||isAdminForClub(match&&match.clubId);
  if(!mayReview) return '';
  return `<div class="verification-actions">
    ${status!=='confirmed'?`<button class="btn btn-ball btn-sm" type="button" onclick="confirmMatchResult(${jsArg(match.id)})">Confirm</button>`:''}
    ${status!=='disputed'?`<button class="btn btn-ghost btn-sm" type="button" onclick="disputeMatchResult(${jsArg(match.id)})">Dispute</button>`:''}
  </div>`;
}
function currentUserIsMatchParticipant(match){
  return !!(state.myPlayerId&&match&&[...(match.team1||[]),...(match.team2||[])].includes(state.myPlayerId));
}
function canReviewMatch(match){
  if(!isSignedIn()||!currentUserIsMatchParticipant(match)) return false;
  return !match.recordedByUid||match.recordedByUid!==state.currentUser.uid;
}
async function confirmMatchResult(matchId){
  if(!allowAction(`confirm:${matchId}`,2000)) return;
  const match=state.matches.find(m=>m.id===matchId);
  if(!match||(!canReviewMatch(match)&&!isAdminForClub(match&&match.clubId))){ toast('Only another participating player or this club’s admin can confirm this result'); return; }
  if(matchVerificationStatus(match)==='confirmed'){ toast('This result is already confirmed'); return; }
  const now=new Date().toISOString();
  const clubAdminReview=isAdminForClub(match.clubId);
  const update={verificationStatus:'confirmed',confirmedByUid:state.currentUser.uid,confirmedByPlayerId:state.myPlayerId||null,confirmedAt:now,resolvedAt:clubAdminReview?now:null,resolvedByUid:clubAdminReview?state.currentUser.uid:null,disputeReason:null};
  try{ await MATCHES_COL.doc(matchId).update(update); }
  catch(e){ console.error(e); toast('Could not confirm the result. Publish the included Firestore rules first.'); return; }
  state.matches=state.matches.map(m=>m.id===matchId?{...m,...update}:m);
  toast('Result confirmed and included in official statistics');
  render();
}
async function disputeMatchResult(matchId){
  if(!allowAction(`dispute:${matchId}`,2000)) return;
  const match=state.matches.find(m=>m.id===matchId);
  if(!match||(!canReviewMatch(match)&&!isAdminForClub(match&&match.clubId))){ toast('Only another participating player or this club’s admin can dispute this result'); return; }
  const entered=prompt('Briefly explain what is incorrect about this result:','');
  if(entered===null) return;
  const reason=entered.trim();
  if(reason.length<3){ toast('Please provide a short reason for the dispute'); return; }
  const update={verificationStatus:'disputed',disputeReason:reason.slice(0,280),disputedByUid:state.currentUser.uid,disputedByPlayerId:state.myPlayerId||null,disputedAt:new Date().toISOString()};
  try{ await MATCHES_COL.doc(matchId).update(update); }
  catch(e){ console.error(e); toast('Could not dispute the result. Publish the included Firestore rules first.'); return; }
  state.matches=state.matches.map(m=>m.id===matchId?{...m,...update}:m);
  toast('Result disputed and removed from official statistics pending review');
  render();
}
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function playerName(id){ const p = state.players.find(x=>x.id===id); return p ? p.name : 'Former player'; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function diffPill(n, decimals){
  decimals = decimals===undefined?0:decimals;
  const cls = n>0?'diff-pos':(n<0?'diff-neg':'diff-zero');
  const sign = n>0?'+':'';
  return `<span class="diff-pill ${cls}">${sign}${n.toFixed(decimals)}</span>`;
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=> el.classList.remove('show'), 2200);
}
function updateOnlineState(online){

  if(document.getElementById('root')) render();
  toast(online?'Back online — queued changes will synchronize':'Offline mode — saved changes will synchronize when connected');
}
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('online',()=>updateOnlineState(true));
  window.addEventListener('offline',()=>updateOnlineState(false));

function setOfflineAccessPreference(enabled){
  if(typeof localStorage==='undefined'){ toast('Offline storage is unavailable in this browser'); return; }
  if(enabled) localStorage.setItem(OFFLINE_PREF_KEY,'enabled');
  else localStorage.removeItem(OFFLINE_PREF_KEY);
  toast('Offline-access preference saved. Reloading CourtRush…');
  setTimeout(()=>{ if(typeof location!=='undefined'&&location.reload) location.reload(); },500);
}

function scheduleDocId(sch){ return sch ? (sch.docId || sch.id || sch.date) : null; }
function scheduleById(id){ return state.schedules.find(s=> scheduleDocId(s)===id || s.id===id) || null; }
function jsArg(value){
  const safe=String(value)
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/\r/g,'\\r')
    .replace(/\n/g,'\\n')
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'\\x3C')
    .replace(/>/g,'\\x3E');
  return `'${safe}'`;
}
function stripScheduleMeta(sch){ const { docId, ...data } = sch; return data; }
function schedulePlayers(sch){
  if(!sch) return [];
  if(Array.isArray(sch.selectedPlayerIds) && sch.selectedPlayerIds.length) return [...new Set(sch.selectedPlayerIds)];
  const rounds = Array.isArray(sch.rounds) ? sch.rounds : [];
  return [...new Set(rounds.flatMap(rd=>[
    ...(rd.courts||[]).flatMap(ct=>[...(ct.team1||[]), ...(ct.team2||[])]),
    ...(rd.sitOuts||[])
  ]))];
}
function normalizeScheduleDoc(docId, data){
  const raw = data || {};
  const fallbackDate = /^\d{4}-\d{2}-\d{2}$/.test(docId) ? docId : todayStr();
  const sch = {
    ...raw,
    docId,
    id: raw.id || docId,
    date: raw.date || fallbackDate,
    startTime: raw.startTime || '',
    mode: raw.mode || 'open',
    format: raw.format || 'doubles',
    courts: Math.max(1, Number(raw.courts)||1),
    rounds: Array.isArray(raw.rounds) ? raw.rounds : [],
    recorded: raw.recorded || {},
    status: raw.status || 'published',
  };
  sch.selectedPlayerIds = schedulePlayers(sch);
  sch.numberOfRounds = Number(raw.numberOfRounds) || sch.rounds.length;
  return sch;
}

function playerMatches(pid){
  return completedMatchesInActiveRange().filter(m=> (m.team1||[]).includes(pid) || (m.team2||[]).includes(pid));
}
function computePlayerStats(pid){
  const ms = playerMatches(pid);
  let wins=0, losses=0, diffSum=0;
  const dateSet = new Set();
  ms.forEach(m=>{
    const onT1 = m.team1.includes(pid);
    const my = onT1 ? m.score1 : m.score2;
    const opp = onT1 ? m.score2 : m.score1;
    diffSum += (my-opp);
    if(my>opp) wins++; else if(my<opp) losses++;
    dateSet.add(m.date);
  });
  const gamesPlayed = ms.length;
  const avgDiff = gamesPlayed ? diffSum/gamesPlayed : 0;
  const dates = Array.from(dateSet).sort();
  let avgDaysPerWeek = 0, avgGamesPerWeek = 0;
  if(dates.length){
    const first = new Date(dates[0]+'T00:00:00');
    const last = new Date(dates[dates.length-1]+'T00:00:00');
    const weeksSpan = Math.max(1, Math.round((last-first)/(7*86400000))+1);
    avgDaysPerWeek = dates.length/weeksSpan;
    avgGamesPerWeek = gamesPlayed/weeksSpan;
  }
  return { gamesPlayed, wins, losses, diffSum, avgDiff, avgDaysPerWeek, avgGamesPerWeek, uniqueDays:dates.length };
}
function computeMatchupMatrix(pid){
  const map = {};
  completedMatchesInActiveRange().forEach(m=>{
    const onT1 = (m.team1||[]).includes(pid), onT2 = (m.team2||[]).includes(pid);
    if(!onT1 && !onT2) return;
    const myTeam = onT1 ? m.team1 : m.team2;
    const oppTeam = onT1 ? m.team2 : m.team1;
    const myScore = onT1 ? m.score1 : m.score2;
    const oppScore = onT1 ? m.score2 : m.score1;
    const diff = myScore - oppScore;
    myTeam.forEach(other=>{
      if(other===pid) return;
      map[other] = map[other] || {gamesWith:0,diffWith:0,gamesAgainst:0,diffAgainst:0};
      map[other].gamesWith++; map[other].diffWith += diff;
    });
    oppTeam.forEach(other=>{
      map[other] = map[other] || {gamesWith:0,diffWith:0,gamesAgainst:0,diffAgainst:0};
      map[other].gamesAgainst++; map[other].diffAgainst += diff;
    });
  });
  return map;
}
function computeH2H(idA, idB, clubId){
  const asOpp = { games:0, aWins:0, bWins:0, ties:0, diffSumA:0 };
  const asTeam = { games:0, wins:0, losses:0, ties:0, diffSum:0 };
  const oppMatches = [];
  completedMatchesInActiveRange().forEach(m=>{
    if(clubId&&clubId!=='all'&&(m.clubId||ACTIVE_CLUB_ID)!==clubId) return;
    const aInT1 = (m.team1||[]).includes(idA), aInT2 = (m.team2||[]).includes(idA);
    const bInT1 = (m.team1||[]).includes(idB), bInT2 = (m.team2||[]).includes(idB);
    if(!(aInT1||aInT2) || !(bInT1||bInT2)) return;
    if((aInT1&&bInT2) || (aInT2&&bInT1)){
      const aScore = aInT1 ? m.score1 : m.score2;
      const bScore = aInT1 ? m.score2 : m.score1;
      asOpp.games++; asOpp.diffSumA += (aScore-bScore);
      if(aScore>bScore) asOpp.aWins++; else if(bScore>aScore) asOpp.bWins++; else asOpp.ties++;
      oppMatches.push(m);
    } else if((aInT1&&bInT1) || (aInT2&&bInT2)){
      const myScore = aInT1 ? m.score1 : m.score2;
      const oppScore = aInT1 ? m.score2 : m.score1;
      asTeam.games++; asTeam.diffSum += (myScore-oppScore);
      if(myScore>oppScore) asTeam.wins++; else if(myScore<oppScore) asTeam.losses++; else asTeam.ties++;
    }
  });
  oppMatches.sort((x,y)=> y.date.localeCompare(x.date));
  return { asOpp, asTeam, oppMatches };
}
function computePlayerGameLog(pid){
  const ms = playerMatches(pid).slice().sort((a,b)=> a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  let running = 0;
  const rows = ms.map((m,idx)=>{
    const onT1 = m.team1.includes(pid);
    const partners = (onT1 ? m.team1 : m.team2).filter(x=>x!==pid);
    const opponents = onT1 ? m.team2 : m.team1;
    const myScore = onT1 ? m.score1 : m.score2;
    const oppScore = onT1 ? m.score2 : m.score1;
    const diff = myScore - oppScore;
    running += diff;
    return { gameNum: idx+1, date: m.date, court: m.court, mode: m.mode||'open', partners, opponents, myScore, oppScore, diff, running };
  });
  return rows.reverse();
}
function scoutingReport(pid){
  const matrix = computeMatchupMatrix(pid);
  const asOpponents = Object.entries(matrix).filter(([,v])=> v.gamesAgainst>0)
    .map(([id,v])=> ({ id, avg: v.diffAgainst/v.gamesAgainst, games:v.gamesAgainst }));
  const asPartners = Object.entries(matrix).filter(([,v])=> v.gamesWith>0)
    .map(([id,v])=> ({ id, avg: v.diffWith/v.gamesWith, games:v.gamesWith }));
  const toughest = asOpponents.length ? asOpponents.slice().sort((a,b)=> a.avg-b.avg)[0] : null;
  const easiest = asOpponents.length ? asOpponents.slice().sort((a,b)=> b.avg-a.avg)[0] : null;
  const bestPartner = asPartners.length ? asPartners.slice().sort((a,b)=> b.avg-a.avg)[0] : null;
  return { toughest, easiest, bestPartner };
}
function computeGamePlanMvp(matches){
  const byPlayer={};
  const add=(pid,myScore,oppScore)=>{
    if(!pid) return;
    const row=byPlayer[pid]||(byPlayer[pid]={id:pid,games:0,wins:0,losses:0,diff:0});
    row.games++;
    row.diff+=myScore-oppScore;
    if(myScore>oppScore) row.wins++;
    else if(myScore<oppScore) row.losses++;
  };
  (matches||[]).forEach(m=>{
    const score1=Number(m.score1),score2=Number(m.score2);
    if(!Number.isFinite(score1)||!Number.isFinite(score2)) return;
    (m.team1||[]).forEach(pid=>add(pid,score1,score2));
    (m.team2||[]).forEach(pid=>add(pid,score2,score1));
  });
  const players=Object.values(byPlayer);
  if(!players.length) return {leaders:[],players:[],topWins:0,topLosses:0,bestDiff:0};
  const recordOrder=[...players].sort((a,b)=>b.wins-a.wins||a.losses-b.losses||b.diff-a.diff||playerName(a.id).localeCompare(playerName(b.id)));
  const topWins=recordOrder[0].wins;
  const topLosses=recordOrder[0].losses;
  const bestDiff=Math.max(...players.map(row=>row.diff));
  const leaders=players
    .filter(row=>row.wins===topWins&&row.losses===topLosses&&row.diff===bestDiff)
    .sort((a,b)=>playerName(a.id).localeCompare(playerName(b.id)));
  return {leaders,players,topWins,topLosses,bestDiff};
}

/* ============================= SCHEDULE ALGORITHM ============================= */
function pairKey(a,b){ return [a,b].sort().join('|'); }

// Classic round-robin "circle method": fixes one player, rotates the rest.
// Produces (M-1) rounds of M/2 pairs, where M is even (padded with BYE tokens if needed),
// and every player is paired with every other player across all rounds exactly once.
function buildCircleRounds(playerIds){
  let pool = [...playerIds];
  let byes = 0;
  while(pool.length % 2 !== 0){ pool.push('BYE_'+(byes++)); }
  const M = pool.length;
  if(M < 2) return [];
  const fixed = pool[0];
  const rot = pool.slice(1);
  const totalRounds = M - 1;
  const rounds = [];
  for(let r=0; r<totalRounds; r++){
    const pairs = [[fixed, rot[r % (M-1)]]];
    for(let i=1; i<M/2; i++){
      const a = rot[(r+i) % (M-1)];
      const b = rot[(r-i+(M-1)) % (M-1)];
      pairs.push([a,b]);
    }
    rounds.push(pairs);
  }
  return rounds;
}
function isBye(x){ return String(x).startsWith('BYE_'); }
function oppScore(teamA, teamB, opponentCount){
  let s=0;
  teamA.forEach(a=> teamB.forEach(b=> s += (opponentCount[pairKey(a,b)]||0)));
  return s;
}

// Guaranteed round robin — used whenever the group actually fits on the courts available,
// so every player partners with (and eventually faces) every other player exactly once.
function generateScheduleRoundRobin({playerIds, format}){
  const opponentCount = {};
  playerIds.forEach(a=> playerIds.forEach(b=>{ if(a!==b) opponentCount[pairKey(a,b)]=0; }));

  if(format==='singles'){
    return buildCircleRounds(playerIds).map((pairs, idx)=>{
      const sitOuts = [];
      const courtsArr = [];
      let c=1;
      pairs.forEach(([a,b])=>{
        if(isBye(a) && isBye(b)) return;
        if(isBye(a)){ sitOuts.push(b); return; }
        if(isBye(b)){ sitOuts.push(a); return; }
        courtsArr.push({court:c++, team1:[a], team2:[b]});
      });
      return {round: idx+1, sitOuts, courts: courtsArr};
    });
  }

  // doubles: first pass builds guaranteed-unique partnerships via the circle method,
  // second pass greedily matches those partnerships against each other, minimizing repeat opponents.
  return buildCircleRounds(playerIds).map((pairs, idx)=>{
    const sitOuts = [];
    const partnerships = [];
    pairs.forEach(([a,b])=>{
      if(isBye(a) && isBye(b)) return;
      if(isBye(a)){ sitOuts.push(b); return; }
      if(isBye(b)){ sitOuts.push(a); return; }
      partnerships.push([a,b]);
    });
    let pool = shuffle(partnerships.map((_,i)=>i));
    const courtsArr = [];
    let c=1;
    while(pool.length>=2){
      const i = pool.shift();
      pool.sort((x,y)=> oppScore(partnerships[i],partnerships[x],opponentCount) - oppScore(partnerships[i],partnerships[y],opponentCount));
      const j = pool.shift();
      const team1 = partnerships[i], team2 = partnerships[j];
      team1.forEach(p1=> team2.forEach(p2=> opponentCount[pairKey(p1,p2)]++));
      courtsArr.push({court:c++, team1, team2});
    }
    pool.forEach(i=> sitOuts.push(...partnerships[i]));
    return {round: idx+1, sitOuts, courts: courtsArr};
  });
}

// Fallback for when there are more players than the available courts can hold at once —
// a perfect one-time-only pairing can't be guaranteed here, so this rotates fairly and
// minimizes repeats as best it can across the auto-calculated round count.
function buildGreedyRound(playerIds, usableCourts, capacity, format, partnerCount, opponentCount, sitOutCount){
  const key = pairKey;
  const numSitOut = playerIds.length - capacity;
  const order = [...playerIds].sort((a,b)=> sitOutCount[a]-sitOutCount[b] || (Math.random()-0.5));
  const sitOuts = numSitOut>0 ? order.slice(0, numSitOut) : [];
  sitOuts.forEach(id=> sitOutCount[id]++);
  let pool = shuffle(playerIds.filter(id=> !sitOuts.includes(id)));
  const courtsArr = [];
  for(let c=1; c<=usableCourts; c++){
    if(pool.length < (format==='singles'?2:4)) break;
    if(format==='singles'){
      const a = pool.shift();
      pool.sort((x,y)=> opponentCount[key(a,x)]-opponentCount[key(a,y)]);
      const b = pool.shift();
      opponentCount[key(a,b)]++;
      courtsArr.push({court:c, team1:[a], team2:[b]});
    } else {
      const a = pool.shift();
      pool.sort((x,y)=> partnerCount[key(a,x)]-partnerCount[key(a,y)]);
      const b = pool.shift();
      partnerCount[key(a,b)]++;
      pool.sort((x,y)=>{
        const sx = opponentCount[key(a,x)]+opponentCount[key(b,x)];
        const sy = opponentCount[key(a,y)]+opponentCount[key(b,y)];
        return sx-sy;
      });
      const c1 = pool.shift();
      pool.sort((x,y)=>{
        const sx = partnerCount[key(c1,x)]*2 + opponentCount[key(a,x)] + opponentCount[key(b,x)];
        const sy = partnerCount[key(c1,y)]*2 + opponentCount[key(a,y)] + opponentCount[key(b,y)];
        return sx-sy;
      });
      const d1 = pool.shift();
      partnerCount[key(c1,d1)]++;
      [a,b].forEach(p1=> [c1,d1].forEach(p2=> opponentCount[key(p1,p2)]++));
      courtsArr.push({court:c, team1:[a,b], team2:[c1,d1]});
    }
  }
  return { sitOuts, courts: courtsArr };
}
function generateScheduleGreedy({playerIds, courts, format}){
  const rounds = autoRoundCount(playerIds.length);
  const capacityPerCourt = format==='singles' ? 2 : 4;
  const usableCourts = Math.max(1, Math.min(courts, Math.floor(playerIds.length/capacityPerCourt)));
  const capacity = usableCourts*capacityPerCourt;
  const sitOutCount = {}; playerIds.forEach(id=> sitOutCount[id]=0);
  const partnerCount = {}, opponentCount = {};
  playerIds.forEach(a=> playerIds.forEach(b=>{ if(a!==b){ partnerCount[pairKey(a,b)]=0; opponentCount[pairKey(a,b)]=0; } }));
  const roundsOut = [];
  for(let r=1; r<=rounds; r++){
    const { sitOuts, courts:courtsArr } = buildGreedyRound(playerIds, usableCourts, capacity, format, partnerCount, opponentCount, sitOutCount);
    roundsOut.push({round:r, sitOuts, courts:courtsArr});
  }
  return roundsOut;
}

function generateSchedule({playerIds, courts, format}){
  const capacityPerCourt = format==='singles' ? 2 : 4;
  const fitsEveryRound = playerIds.length <= Math.max(1,courts)*capacityPerCourt;
  return fitsEveryRound
    ? generateScheduleRoundRobin({playerIds, format})
    : generateScheduleGreedy({playerIds, courts, format});
}

async function ensureGooglePlayerProfile(user, requestedClubId){
  const userRef=USERS_COL.doc(user.uid);
  const userSnap=await userRef.get();
  const saved=userSnap.exists?userSnap.data():{};
  const email=user.email||saved.email||'';
  const googleName=(user.displayName||'').trim();
  const name=(saved.displayName||googleName||(email?email.split('@')[0]:'Club player')).trim();
  const photoURL=user.photoURL||saved.photoURL||'';
  const requestedClub=requestedClubId&&clubById(requestedClubId)?requestedClubId:null;
  const savedClubIds=Array.isArray(saved.clubIds)?saved.clubIds.filter(Boolean):(saved.clubId?[saved.clubId]:[]);
  let playerId=saved.playerId||null;
  let player=playerId?state.players.find(p=>p.id===playerId):null;
  if(!playerId){
    player=state.players.find(p=>p.ownerUid===user.uid)||state.players.find(p=>!p.ownerUid&&p.name.trim().toLowerCase()===name.toLowerCase()&&(!requestedClub||playerIsMemberOfClub(p,requestedClub)))||null;
    playerId=player?player.id:uid('pl');
  }
  const playerRef=PLAYERS_COL.doc(playerId);
  const existingClubIds=player?playerClubIds(player):[];
  const clubIds=[...new Set([...existingClubIds,...savedClubIds])].filter(id=>!!clubById(id));
  const primaryClubId=saved.clubId||clubIds[0]||null;
  if(player){
    const updates={ownerUid:user.uid,clubId:primaryClubId,clubIds};
    if(photoURL) updates.avatarUrl=photoURL;
    await playerRef.set(updates,{merge:true});
  }else{
    await playerRef.set({id:playerId,name,guest:false,clubId:primaryClubId,clubIds,createdAt:new Date().toISOString(),ownerUid:user.uid,...(photoURL?{avatarUrl:photoURL}:{})});
  }
  const joinRequested=!!(requestedClub&&!clubIds.includes(requestedClub));
  if(joinRequested){
    const membershipId=clubMembershipId(requestedClub,playerId);
    const now=new Date().toISOString();
    await CLUB_MEMBERSHIPS_COL.doc(membershipId).set({id:membershipId,clubId:requestedClub,playerId,status:'pending',requestedByUid:user.uid,requestedAt:now,updatedAt:now},{merge:true});
  }
  await userRef.set({displayName:name,email,role:saved.role||'player',clubId:primaryClubId,clubIds,playerId,photoURL,authProvider:'google.com',updatedAt:new Date().toISOString(),...(saved.createdAt?{}:{createdAt:new Date().toISOString()})},{merge:true});
  return {playerId,name,joinRequested,requestedClub};
}

async function submitAuthForm(ev){
  ev.preventDefault();
  const mode = state.authMode;
  const email = document.getElementById('auth_email').value.trim();
  const password = document.getElementById('auth_password').value;
  const name = mode==='register' ? document.getElementById('auth_name').value.trim() : null;
  const registrationClubEl=mode==='register'?document.getElementById('auth_club'):null;
  const registrationClubId=registrationClubEl&&clubById(registrationClubEl.value)?registrationClubEl.value:null;
  if(!email || !password){ toast('Enter email and password'); return; }
  if(mode==='register' && !name){ toast('Enter your player name'); return; }
  state.authBusy = true; render();
  try{
    if(mode==='register'){
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      // Link to an existing unclaimed roster entry with a matching name if one exists,
      // so an admin-added player's history isn't duplicated when they register.
      const existing = state.players.find(p=> !p.ownerUid && p.name.trim().toLowerCase()===name.toLowerCase() && (!registrationClubId||playerIsMemberOfClub(p,registrationClubId)));
      let playerId;
      let registeredClubIds=[];
      if(existing){
        playerId = existing.id;
        registeredClubIds=[...new Set(playerClubIds(existing))];
        await PLAYERS_COL.doc(playerId).update({ ownerUid: cred.user.uid, clubId:existing.clubId||registeredClubIds[0]||null, clubIds:registeredClubIds });
      } else {
        playerId = uid('pl');
        await PLAYERS_COL.doc(playerId).set({ id:playerId, name, guest:false, clubId:null, clubIds:[], createdAt:new Date().toISOString(), ownerUid:cred.user.uid });
      }
      const joinRequested=!!(registrationClubId&&!registeredClubIds.includes(registrationClubId));
      if(joinRequested){
        const membershipId=clubMembershipId(registrationClubId,playerId);
        const now=new Date().toISOString();
        await CLUB_MEMBERSHIPS_COL.doc(membershipId).set({id:membershipId,clubId:registrationClubId,playerId,status:'pending',requestedByUid:cred.user.uid,requestedAt:now,updatedAt:now});
      }
      await USERS_COL.doc(cred.user.uid).set({ displayName:name, email, role:'player', clubId:registeredClubIds[0]||null, clubIds:registeredClubIds, playerId, createdAt:new Date().toISOString() });
      toast(joinRequested?`Welcome, ${name}! Your request to join ${clubName(registrationClubId)} was sent.`:`Welcome to CourtRush, ${name}!`);
    } else {
      await auth.signInWithEmailAndPassword(email, password);
      toast('Signed in');
    }
    state.showAuthModal = false;
  }catch(e){
    toast(e.message ? e.message.replace('Firebase: ','') : 'Something went wrong');
  }
  state.authBusy = false;
  render();
}

function canViewPlayerProfile(player){
  if(!player) return false;
  if(isSuperAdmin()||state.myPlayerId===player.id||activePlayerClubIds(player).some(id=>isClubAdmin(id))) return true;
  const visibility=profileVisibilityValue(player);
  if(visibility==='public') return true;
  if(visibility==='club'){
    const viewer=state.players.find(p=>p.id===state.myPlayerId);
    const viewerClubs=new Set(activePlayerClubIds(viewer));
    return isSignedIn()&&activePlayerClubIds(player).some(id=>viewerClubs.has(id));

  return false;
}
