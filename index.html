<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PickleHub — Rising Club Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --court:#0E5F58;
    --court-deep:#0A3F3A;
    --court-light:#12786F;
    --ink:#0B2321;
    --bg:#EDF5F2;
    --panel:#FFFFFF;
    --ball:#D6E62B;
    --ball-deep:#A9B818;
    --coral:#EF6351;
    --line:#D7E5E0;
    --muted:#5B7A74;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:1180px;margin:0 auto;padding:0 20px 80px;}
  h1,h2,h3{font-family:'Bebas Neue',sans-serif;letter-spacing:0.02em;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 0 14px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:42px;height:42px;border-radius:10px;background:var(--court);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 3px 0 var(--court-deep);
  }
  .brand-name{font-size:30px;line-height:1;color:var(--court-deep);}
  .brand-sub{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:2px;}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .account-chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 10px 5px 5px;cursor:pointer;}
  .account-chip:hover{border-color:var(--court);}

  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:6px;background:var(--panel);border-radius:12px;border:1px solid var(--line);}
  nav.tabs button{
    border:none;background:transparent;padding:9px 14px;border-radius:8px;
    font-weight:600;font-size:13.5px;color:var(--muted);transition:all .15s ease;
  }
  nav.tabs button.active{background:var(--court);color:#fff;}
  nav.tabs button:not(.active):hover{background:var(--bg);color:var(--ink);}

  /* ---------- Cards / panels ---------- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .panel + .panel{margin-top:16px;}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .section-title h2{font-size:22px;color:var(--court-deep);}
  .eyebrow{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;}

  /* ---------- Hero / scoreboard ---------- */
  .hero{
    background:linear-gradient(135deg,var(--court) 0%,var(--court-deep) 100%);
    border-radius:20px;padding:30px 28px;color:#fff;position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(214,230,43,0.18) 0%,rgba(214,230,43,0) 70%);
  }
  .hero-top{position:relative;z-index:1;}
  .hero h1{font-size:38px;color:#fff;}
  .hero p{margin:6px 0 0;color:rgba(255,255,255,0.75);font-size:14.5px;max-width:520px;}
  .score-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:22px;position:relative;z-index:1;}
  .score-tile{background:rgba(0,0,0,0.18);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:14px 16px;}
  .score-tile .num{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;color:var(--ball);}
  .score-tile .lbl{font-size:11.5px;color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;margin-top:2px;}

  /* ---------- Leaderboard ---------- */
  .board-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
  @media(max-width:760px){.board-grid{grid-template-columns:1fr;}}
  .board-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);}
  .board-row:last-child{border-bottom:none;}
  .rank{width:22px;font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:13px;}
  .board-name{flex:1;font-weight:600;font-size:14px;}
  .board-sub{font-size:11.5px;color:var(--muted);}
  .diff-pill{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;padding:3px 9px;border-radius:20px;}
  .diff-pos{background:rgba(14,95,88,0.1);color:var(--court);}
  .diff-neg{background:rgba(239,99,81,0.1);color:var(--coral);}
  .diff-zero{background:var(--bg);color:var(--muted);}

  /* ---------- Buttons ---------- */
  .btn{border-radius:9px;padding:10px 16px;font-weight:700;font-size:13.5px;border:none;transition:transform .1s ease;}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--court);color:#fff;}
  .btn-primary:hover{background:var(--court-light);}
  .btn-ball{background:var(--ball);color:var(--court-deep);}
  .btn-ball:hover{background:#c3d322;}
  .btn-ghost{background:transparent;color:var(--court);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--court);}
  .btn-danger{background:transparent;color:var(--coral);border:1.5px solid rgba(239,99,81,0.3);}
  .btn-danger:hover{background:rgba(239,99,81,0.08);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  /* ---------- Forms ---------- */
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;}
  input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],select{
    width:100%;padding:10px 11px;border-radius:8px;border:1.5px solid var(--line);
    font-family:'Inter',sans-serif;font-size:14px;background:#fff;color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--court-light);outline-offset:1px;border-color:var(--court-light);}
  .field{margin-bottom:14px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .inline-row{display:flex;gap:10px;align-items:flex-end;}
  .inline-row .field{flex:1;margin-bottom:0;}

  /* ---------- Roster table ---------- */
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line);}
  td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover td{background:var(--bg);}
  .name-cell{font-weight:700;}
  .guest-tag{font-size:10px;background:var(--bg);color:var(--muted);padding:2px 7px;border-radius:20px;margin-left:6px;font-weight:700;text-transform:uppercase;}

  /* ---------- Empty state ---------- */
  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty h3{color:var(--ink);font-size:20px;margin-bottom:6px;}
  .empty p{font-size:14px;margin:0 0 16px;}

  /* ---------- Paddle icon / stack (signature element) ---------- */
  .paddle{display:inline-flex;vertical-align:middle;}
  .paddle-stack{display:flex;flex-direction:column;gap:8px;}
  .paddle-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border-radius:9px;border:1px solid var(--line);}
  .paddle-row .p-order{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);width:18px;}
  .paddle-row .p-name{font-weight:600;font-size:13.5px;flex:1;}

  /* ---------- Court diagram ---------- */
  .court-card{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px;}
  .court-head{background:var(--court-deep);color:#fff;padding:8px 14px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.05em;display:flex;justify-content:space-between;align-items:center;}
  .court-body{background:linear-gradient(180deg,var(--court) 0%,var(--court-light) 100%);padding:16px 14px;}
  .team-row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.12);border-radius:9px;padding:10px 12px;color:#fff;font-weight:600;font-size:14px;}
  .team-row + .team-row{margin-top:0;}
  .net-line{display:flex;align-items:center;gap:8px;margin:8px 0;color:rgba(255,255,255,0.6);font-size:10px;text-transform:uppercase;letter-spacing:0.18em;font-weight:700;}
  .net-line::before,.net-line::after{content:"";flex:1;height:1px;background:repeating-linear-gradient(90deg,rgba(255,255,255,0.5) 0 6px,transparent 6px 12px);}
  .score-inputs{display:flex;gap:8px;align-items:center;margin-top:12px;}
  .score-inputs input{width:64px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:700;}
  .score-vs{color:rgba(255,255,255,0.6);font-size:12px;font-weight:700;}
  .recorded-badge{background:var(--ball);color:var(--court-deep);font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,30,27,0.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .modal{background:var(--panel);border-radius:16px;max-width:640px;width:100%;padding:24px;position:relative;}
  .modal-close{position:absolute;top:16px;right:16px;background:var(--bg);border:none;width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--muted);font-weight:700;}
  .modal-close:hover{background:var(--line);}

  /* ---------- Chips / checkboxes ---------- */
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1.5px solid var(--line);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;background:#fff;}
  .chip.on{background:var(--court);border-color:var(--court);color:#fff;}
  .chip .cnt{opacity:0.7;font-size:11px;margin-left:4px;}

  /* ---------- Toast ---------- */
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:9px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s ease;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,0.2);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .muted{color:var(--muted);}
  .small{font-size:12.5px;}
  .flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .divider{height:1px;background:var(--line);margin:16px 0;}
  .round-label{display:inline-flex;align-items:center;gap:6px;font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--court-deep);letter-spacing:0.03em;margin:22px 0 10px;}
  .round-label:first-child{margin-top:4px;}
  .link-btn{background:none;border:none;color:var(--court);font-weight:700;font-size:13px;padding:0;text-decoration:underline;}

  /* ---------- Play mode picker ---------- */
  .mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
  .mode-card{border:1.5px solid var(--line);border-radius:14px;padding:18px;text-align:left;background:#fff;cursor:pointer;transition:all .15s ease;}
  .mode-card:hover{border-color:var(--court);transform:translateY(-1px);}
  .mode-card .mtitle{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--court-deep);letter-spacing:0.02em;}
  .mode-card .mdesc{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.4;}
  .mode-badge{display:inline-flex;align-items:center;gap:6px;background:var(--court-deep);color:#fff;font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;padding:5px 12px;border-radius:20px;}
  .team-stage-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg);border-radius:9px;border:1px solid var(--line);font-size:13.5px;font-weight:600;}
  .team-stage-row + .team-stage-row{margin-top:6px;}


  /* ---------- Schedule foundation ---------- */
  .schedule-page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .schedule-page-head h1{font-size:34px;color:var(--court-deep);line-height:1;}
  .schedule-page-head p{margin:6px 0 0;max-width:620px;}
  .schedule-filters{display:flex;gap:6px;overflow-x:auto;padding:5px;background:var(--bg);border:1px solid var(--line);border-radius:11px;-webkit-overflow-scrolling:touch;}
  .schedule-filters::-webkit-scrollbar{display:none;}
  .schedule-filter{border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;padding:9px 14px;border-radius:8px;white-space:nowrap;}
  .schedule-filter.active{background:var(--court);color:#fff;}
  .game-plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;}
  .game-plan-card{border:1.5px solid var(--line);border-radius:15px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:14px;min-width:0;}
  .game-plan-card:hover{border-color:rgba(14,95,88,0.55);box-shadow:0 8px 24px rgba(10,63,58,0.07);}
  .game-plan-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .game-plan-date{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;}
  .game-plan-time{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--court-deep);line-height:1;margin-top:4px;}
  .game-plan-title{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--ink);line-height:1.05;}
  .game-plan-creator{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .game-plan-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .game-plan-metric{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;}
  .game-plan-metric strong{display:block;font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--court-deep);}
  .game-plan-metric span{display:block;font-size:10px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
  .game-plan-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;}
  .status-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.07em;border-radius:20px;padding:5px 9px;background:var(--bg);color:var(--muted);}
  .status-badge.published,.status-badge.in_progress{background:rgba(14,95,88,0.1);color:var(--court);}
  .status-badge.completed{background:rgba(214,230,43,0.28);color:var(--court-deep);}
  .status-badge.cancelled{background:rgba(239,99,81,0.1);color:var(--coral);}
  .builder-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,0.75fr);gap:16px;align-items:start;}
  .builder-sticky{position:sticky;top:12px;}
  .builder-section{padding:16px 0;border-top:1px solid var(--line);}
  .builder-section:first-of-type{border-top:none;padding-top:0;}
  .selection-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .plan-preview{background:linear-gradient(145deg,var(--court-deep),var(--court));border-radius:15px;padding:20px;color:#fff;overflow:hidden;position:relative;}
  .plan-preview::after{content:"";position:absolute;right:-45px;top:-45px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(214,230,43,0.22),rgba(214,230,43,0));}
  .plan-preview > *{position:relative;z-index:1;}
  .plan-preview h2{font-size:27px;color:#fff;}
  .preview-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px;}
  .preview-metric{background:rgba(0,0,0,0.17);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:11px;}
  .preview-metric strong{display:block;font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--ball);}
  .preview-metric span{font-size:10px;text-transform:uppercase;letter-spacing:0.07em;font-weight:700;color:rgba(255,255,255,0.68);}
  .preview-finish{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.16);display:flex;justify-content:space-between;gap:10px;align-items:center;}
  .preview-finish strong{font-family:'IBM Plex Mono',monospace;color:var(--ball);}
  .plan-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-top:16px;}
  .plan-summary-item{padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;}
  .plan-summary-item strong{font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--court-deep);display:block;}
  .plan-summary-item span{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);}
  .participant-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
  .participant-pill{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:6px 10px;font-size:12px;font-weight:700;}
  .form-note{border-left:3px solid var(--ball-deep);background:rgba(214,230,43,0.12);padding:10px 12px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--muted);}
  .court-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}

  /* ---------- Mobile ---------- */
  @media (max-width: 700px){
    #root{padding:0 12px 70px;}
    .topbar{flex-direction:column;align-items:stretch;gap:12px;padding:16px 0 10px;}
    .topbar-right{justify-content:space-between;}
    nav.tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;}
    nav.tabs::-webkit-scrollbar{display:none;}
    nav.tabs button{flex:0 0 auto;}
    .hero{padding:22px 18px;border-radius:16px;}
    .hero h1{font-size:28px;}
    .hero p{font-size:13px;}
    .score-tiles{grid-template-columns:repeat(2,1fr);}
    .board-grid{grid-template-columns:1fr;}
    .field-row{grid-template-columns:1fr;}
    .mode-grid{grid-template-columns:1fr;}
    .modal-overlay{padding:0;align-items:stretch;}
    .modal{max-width:100%;width:100%;min-height:100%;border-radius:0;padding:18px 16px 32px;}
    table{display:block;width:100%;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;}
    .inline-row{flex-direction:column;align-items:stretch;}
    .brand-name{font-size:26px;}
    .builder-layout{grid-template-columns:1fr;}
    .builder-sticky{position:static;}
    .game-plan-grid{grid-template-columns:1fr;}
    .schedule-page-head .btn{width:100%;}
    .game-plan-metrics{grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* ============================= FIREBASE ============================= */
const firebaseConfig = {
  apiKey: "AIzaSyBHvV4GTdsjbdc09gJOx-exuT5IaNOf92w",
  authDomain: "picklehub-10acc.firebaseapp.com",
  projectId: "picklehub-10acc",
  storageBucket: "picklehub-10acc.firebasestorage.app",
  messagingSenderId: "677766385806",
  appId: "1:677766385806:web:aa085bb295937b79e279df"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const PLAYERS_COL = db.collection('players');
const MATCHES_COL = db.collection('matches');
const SCHEDULES_COL = db.collection('schedules'); // Phase 3: new plans use unique document IDs; legacy date-keyed docs remain supported
const USERS_COL = db.collection('users');

/* ============================= STATE ============================= */
let state = {
  loading: true,
  connected: true,
  tab: 'dashboard',
  players: [],
  matches: [],
  schedules: [],          // normalized Firestore documents; each item includes docId
  scheduleScreen: 'list', // 'list' | 'create' | 'edit' | 'view'
  scheduleFilter: 'today',// 'today' | 'upcoming' | 'mine'
  activeScheduleId: null,
  scheduleDraft: null,
  tournamentTeams: null,  // [[p1,p2], ...] staged fixed teams
  tournamentLeftover: null,
  playerModalId: null,
  showAddPlayer: false,
  scheduleSelection: new Set(),
  h2hA: null,
  h2hB: null,
  currentUser: null,      // { uid, email, role:'admin'|'player', playerId }
  myPlayerId: null,       // shortcut to currentUser.playerId, kept for convenience
  showAuthModal: false,
  authMode: 'login',      // 'login' | 'register'
  authBusy: false,
};

const MODE_META = {
  open:       { label:'Open Play',    short:'Open Play',   desc:'Partners and opponents rotate every round so everyone mixes.' },
  tournament: { label:'Tournament',   short:'Tournament',  desc:'Teams are locked in for the whole event and face every other team once.' },

function isAdmin(){ return !!(state.currentUser && state.currentUser.role==='admin'); }
function isSignedIn(){ return !!state.currentUser; }

/* Schedule reads are scoped to the active landing filter. Today/Upcoming share
   one future-plans query; My Created uses an owner query. Leaving Schedule
   unsubscribes so the app does not keep downloading schedule changes needlessly. */
let scheduleUnsub=null;
let scheduleSyncKey=null;
function stopScheduleSync(){
  if(scheduleUnsub){ scheduleUnsub(); scheduleUnsub=null; }
  scheduleSyncKey=null;
}
function refreshScheduleSync(force){
  if(state.tab!=='schedule'){ stopScheduleSync(); return; }
  if(!state.currentUser){
    stopScheduleSync();
    state.schedules=[];
    return;
  }
  if(typeof SCHEDULES_COL.where!=='function') return;
  const mine=state.scheduleFilter==='mine';
  const key=mine?`mine:${state.currentUser.uid}`:`future:${state.currentUser?state.currentUser.uid:'guest'}:${todayStr()}`;
  if(!force&&scheduleUnsub&&scheduleSyncKey===key) return;
  stopScheduleSync();
  scheduleSyncKey=key;
  const source=mine
    ? SCHEDULES_COL.where('createdBy','==',state.currentUser.uid)
    : SCHEDULES_COL.where('date','>=',todayStr());
  scheduleUnsub=source.onSnapshot(snap=>{
    state.schedules=snap.docs.map(d=>normalizeScheduleDoc(d.id,d.data()));
    state.connected=true;
    render();
  },err=>{
    console.error(err);
    stopScheduleSync();
    state.schedules=[];
    state.connected=false;
    toast('Could not load Game Plans — check your connection or Firestore rules');
    render();
  });
}

/* ============================= AUTH ============================= */
let userDocUnsub = null;
auth.onAuthStateChanged(user=>{
  if(userDocUnsub){ userDocUnsub(); userDocUnsub=null; }
  if(!user){
    state.currentUser = null;
    state.myPlayerId = null;
    refreshScheduleSync(true);
    render();
    return;
  }
  state.currentUser = { uid:user.uid, email:user.email, role:'player', playerId:null };
  refreshScheduleSync(true);
  render();
  userDocUnsub = USERS_COL.doc(user.uid).onSnapshot(doc=>{
    if(doc.exists){
      const d = doc.data();
      state.currentUser = { uid:user.uid, email:user.email, role: d.role||'player', playerId: d.playerId||null };
      state.myPlayerId = d.playerId || null;
    }
    render();
  }, err=> console.error(err));
});

/* ============================= REALTIME SYNC ============================= */
function startSync(){
  PLAYERS_COL.onSnapshot(snap=>{
    state.players = snap.docs.map(d=>d.data());
    state.connected = true;
    render();
  }, err=>{ console.error(err); state.connected=false; toast('Sync error — check your connection'); render(); });

  MATCHES_COL.onSnapshot(snap=>{
    state.matches = snap.docs.map(d=>d.data());
    render();
  }, err=>{ console.error(err); });

}

/* ============================= SCHEDULE MATH ============================= */
// So every player partners with (and faces) every other player exactly once,
// classic round-robin "circle method" needs N-1 rounds for even N, N rounds for odd N (one bye/sit-out each round).
function autoRoundCount(n){
  if(n < 2) return 0;
  return (n % 2 === 0) ? (n - 1) : n;
}


/* ============================= HELPERS ============================= */
function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtDate(s){ const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function playerName(id){ const p = state.players.find(x=>x.id===id); return p ? p.name : 'Former player'; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function diffPill(n, decimals){
  decimals = decimals===undefined?0:decimals;
  const cls = n>0?'diff-pos':(n<0?'diff-neg':'diff-zero');
  const sign = n>0?'+':'';
  return `<span class="diff-pill ${cls}">${sign}${n.toFixed(decimals)}</span>`;
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=> el.classList.remove('show'), 2200);
}
function paddleSVG(color){
  color = color || 'var(--court)';
  return `<svg class="paddle" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="12" cy="9" rx="7" ry="8.5" fill="${color}"/>
    <rect x="10.5" y="16" width="3" height="7" rx="1.3" fill="${color}"/>
  </svg>`;
}

function scheduleDocId(sch){ return sch ? (sch.docId || sch.id || sch.date) : null; }
function scheduleById(id){ return state.schedules.find(s=> scheduleDocId(s)===id || s.id===id) || null; }
function jsArg(value){
  const safe=String(value)
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/\r/g,'\\r')
    .replace(/\n/g,'\\n')
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'\\x3C')
    .replace(/>/g,'\\x3E');
  return `'${safe}'`;
}
function stripScheduleMeta(sch){ const { docId, ...data } = sch; return data; }
function schedulePlayers(sch){
  if(!sch) return [];
  if(Array.isArray(sch.selectedPlayerIds) && sch.selectedPlayerIds.length) return [...new Set(sch.selectedPlayerIds)];
  const rounds = Array.isArray(sch.rounds) ? sch.rounds : [];
  return [...new Set(rounds.flatMap(rd=>[
    ...(rd.courts||[]).flatMap(ct=>[...(ct.team1||[]), ...(ct.team2||[])]),
    ...(rd.sitOuts||[])
  ]))];
}
function normalizeScheduleDoc(docId, data){
  const raw = data || {};
  const fallbackDate = /^\d{4}-\d{2}-\d{2}$/.test(docId) ? docId : todayStr();
  const sch = {
    ...raw,
    docId,
    id: raw.id || docId,
    date: raw.date || fallbackDate,
    startTime: raw.startTime || '',
    mode: raw.mode || 'open',
    format: raw.format || 'doubles',
    courts: Math.max(1, Number(raw.courts)||1),
    rounds: Array.isArray(raw.rounds) ? raw.rounds : [],
    recorded: raw.recorded || {},
    status: raw.status || 'published',
  };
  sch.selectedPlayerIds = schedulePlayers(sch);
  sch.numberOfRounds = Number(raw.numberOfRounds) || sch.rounds.length;
  return sch;
}
function upsertScheduleLocal(docId, data){
  const normalized = normalizeScheduleDoc(docId, data);
  const idx = state.schedules.findIndex(s=> scheduleDocId(s)===docId);
  if(idx>=0) state.schedules[idx] = normalized;
  else state.schedules.push(normalized);
  return normalized;
}
function scheduleRoundCount(sch){ return Array.isArray(sch&&sch.rounds) ? sch.rounds.length : 0; }
function scheduleGameCount(sch){ return (sch&&Array.isArray(sch.rounds)) ? sch.rounds.reduce((sum,rd)=>sum+(rd.courts||[]).length,0) : 0; }
function canManageSchedule(sch){ return !!(state.currentUser && sch && (isAdmin() || sch.createdBy===state.currentUser.uid)); }
function scheduleSortValue(sch){ return `${sch.date||'0000-00-00'}T${sch.startTime||'00:00'}`; }
function formatTime(time){
  if(!time || !/^\d{2}:\d{2}$/.test(time)) return 'Time not set';
  const [h,m] = time.split(':').map(Number);
  const d = new Date(2000,0,1,h,m,0,0);
  return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
function addMinutesToTime(time, minutes){
  if(!time || !/^\d{2}:\d{2}$/.test(time)) return '—';
  const [h,m] = time.split(':').map(Number);
  const d = new Date(2000,0,1,h,m,0,0);
  d.setMinutes(d.getMinutes() + Math.max(0, Number(minutes)||0));
  return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
function currentCreatorName(){ return state.myPlayerId ? playerName(state.myPlayerId) : (state.currentUser ? state.currentUser.email : 'Club player'); }
function sameIdSet(a,b){
  const aa=[...new Set(a||[])].sort(), bb=[...new Set(b||[])].sort();
  return aa.length===bb.length && aa.every((v,i)=>v===bb[i]);
}

/* ============================= STATS ============================= */
function playerMatches(pid){
  return state.matches.filter(m=> m.team1.includes(pid) || m.team2.includes(pid));
}
function computePlayerStats(pid){
  const ms = playerMatches(pid);
  let wins=0, losses=0, diffSum=0;
  const dateSet = new Set();
  ms.forEach(m=>{
    const onT1 = m.team1.includes(pid);
    const my = onT1 ? m.score1 : m.score2;
    const opp = onT1 ? m.score2 : m.score1;
    diffSum += (my-opp);
    if(my>opp) wins++; else if(my<opp) losses++;
    dateSet.add(m.date);
  });
  const gamesPlayed = ms.length;
  const avgDiff = gamesPlayed ? diffSum/gamesPlayed : 0;
  const dates = Array.from(dateSet).sort();
  let avgDaysPerWeek = 0, avgGamesPerWeek = 0;
  if(dates.length){
    const first = new Date(dates[0]+'T00:00:00');
    const last = new Date(dates[dates.length-1]+'T00:00:00');
    const weeksSpan = Math.max(1, Math.round((last-first)/(7*86400000))+1);
    avgDaysPerWeek = dates.length/weeksSpan;
    avgGamesPerWeek = gamesPlayed/weeksSpan;
  }
  return { gamesPlayed, wins, losses, diffSum, avgDiff, avgDaysPerWeek, avgGamesPerWeek, uniqueDays:dates.length };
}
function computeMatchupMatrix(pid){
  const map = {};
  state.matches.forEach(m=>{
    const onT1 = m.team1.includes(pid), onT2 = m.team2.includes(pid);
    if(!onT1 && !onT2) return;
    const myTeam = onT1 ? m.team1 : m.team2;
    const oppTeam = onT1 ? m.team2 : m.team1;
    const myScore = onT1 ? m.score1 : m.score2;
    const oppScore = onT1 ? m.score2 : m.score1;
    const diff = myScore - oppScore;
    myTeam.forEach(other=>{
      if(other===pid) return;
      map[other] = map[other] || {gamesWith:0,diffWith:0,gamesAgainst:0,diffAgainst:0};
      map[other].gamesWith++; map[other].diffWith += diff;
    });
    oppTeam.forEach(other=>{
      map[other] = map[other] || {gamesWith:0,diffWith:0,gamesAgainst:0,diffAgainst:0};
      map[other].gamesAgainst++; map[other].diffAgainst += diff;
    });
  });
  return map;
}
function computeH2H(idA, idB){
  const asOpp = { games:0, aWins:0, bWins:0, ties:0, diffSumA:0 };
  const asTeam = { games:0, diffSum:0 };
  const oppMatches = [];
  state.matches.forEach(m=>{
    const aInT1 = m.team1.includes(idA), aInT2 = m.team2.includes(idA);
    const bInT1 = m.team1.includes(idB), bInT2 = m.team2.includes(idB);
    if(!(aInT1||aInT2) || !(bInT1||bInT2)) return;
    if((aInT1&&bInT2) || (aInT2&&bInT1)){
      const aScore = aInT1 ? m.score1 : m.score2;
      const bScore = aInT1 ? m.score2 : m.score1;
      asOpp.games++; asOpp.diffSumA += (aScore-bScore);
      if(aScore>bScore) asOpp.aWins++; else if(bScore>aScore) asOpp.bWins++; else asOpp.ties++;
      oppMatches.push(m);
    } else if((aInT1&&bInT1) || (aInT2&&bInT2)){
      const myScore = aInT1 ? m.score1 : m.score2;
      const oppScore = aInT1 ? m.score2 : m.score1;
      asTeam.games++; asTeam.diffSum += (myScore-oppScore);
    }
  });
  oppMatches.sort((x,y)=> y.date.localeCompare(x.date));
  return { asOpp, asTeam, oppMatches };
}
function computePlayerGameLog(pid){
  const ms = playerMatches(pid).slice().sort((a,b)=> a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  let running = 0;
  const rows = ms.map((m,idx)=>{
    const onT1 = m.team1.includes(pid);
    const partners = (onT1 ? m.team1 : m.team2).filter(x=>x!==pid);
    const opponents = onT1 ? m.team2 : m.team1;
    const myScore = onT1 ? m.score1 : m.score2;
    const oppScore = onT1 ? m.score2 : m.score1;
    const diff = myScore - oppScore;
    running += diff;
    return { gameNum: idx+1, date: m.date, court: m.court, mode: m.mode||'open', partners, opponents, myScore, oppScore, diff, running };
  });
  return rows.reverse();
}
function scoutingReport(pid){
  const matrix = computeMatchupMatrix(pid);
  const asOpponents = Object.entries(matrix).filter(([,v])=> v.gamesAgainst>0)
    .map(([id,v])=> ({ id, avg: v.diffAgainst/v.gamesAgainst, games:v.gamesAgainst }));
  const asPartners = Object.entries(matrix).filter(([,v])=> v.gamesWith>0)
    .map(([id,v])=> ({ id, avg: v.diffWith/v.gamesWith, games:v.gamesWith }));
  const toughest = asOpponents.length ? asOpponents.slice().sort((a,b)=> a.avg-b.avg)[0] : null;
  const easiest = asOpponents.length ? asOpponents.slice().sort((a,b)=> b.avg-a.avg)[0] : null;
  const bestPartner = asPartners.length ? asPartners.slice().sort((a,b)=> b.avg-a.avg)[0] : null;
  return { toughest, easiest, bestPartner };
}

/* ============================= SCHEDULE ALGORITHM ============================= */
function pairKey(a,b){ return [a,b].sort().join('|'); }

// Classic round-robin "circle method": fixes one player, rotates the rest.
// Produces (M-1) rounds of M/2 pairs, where M is even (padded with BYE tokens if needed),
// and every player is paired with every other player across all rounds exactly once.
function buildCircleRounds(playerIds){
  let pool = [...playerIds];
  let byes = 0;
  while(pool.length % 2 !== 0){ pool.push('BYE_'+(byes++)); }
  const M = pool.length;
  if(M < 2) return [];
  const fixed = pool[0];
  const rot = pool.slice(1);
  const totalRounds = M - 1;
  const rounds = [];
  for(let r=0; r<totalRounds; r++){
    const pairs = [[fixed, rot[r % (M-1)]]];
    for(let i=1; i<M/2; i++){
      const a = rot[(r+i) % (M-1)];
      const b = rot[(r-i+(M-1)) % (M-1)];
      pairs.push([a,b]);
    }
    rounds.push(pairs);
  }
  return rounds;
}
function isBye(x){ return String(x).startsWith('BYE_'); }
function oppScore(teamA, teamB, opponentCount){
  let s=0;
  teamA.forEach(a=> teamB.forEach(b=> s += (opponentCount[pairKey(a,b)]||0)));
  return s;
}

// Guaranteed round robin — used whenever the group actually fits on the courts available,
// so every player partners with (and eventually faces) every other player exactly once.
function generateScheduleRoundRobin({playerIds, format}){
  const opponentCount = {};
  playerIds.forEach(a=> playerIds.forEach(b=>{ if(a!==b) opponentCount[pairKey(a,b)]=0; }));

  if(format==='singles'){
    return buildCircleRounds(playerIds).map((pairs, idx)=>{
      const sitOuts = [];
      const courtsArr = [];
      let c=1;
      pairs.forEach(([a,b])=>{
        if(isBye(a) && isBye(b)) return;
        if(isBye(a)){ sitOuts.push(b); return; }
        if(isBye(b)){ sitOuts.push(a); return; }
        courtsArr.push({court:c++, team1:[a], team2:[b]});
      });
      return {round: idx+1, sitOuts, courts: courtsArr};
    });
  }

  // doubles: first pass builds guaranteed-unique partnerships via the circle method,
  // second pass greedily matches those partnerships against each other, minimizing repeat opponents.
  return buildCircleRounds(playerIds).map((pairs, idx)=>{
    const sitOuts = [];
    const partnerships = [];
    pairs.forEach(([a,b])=>{
      if(isBye(a) && isBye(b)) return;
      if(isBye(a)){ sitOuts.push(b); return; }
      if(isBye(b)){ sitOuts.push(a); return; }
      partnerships.push([a,b]);
    });
    let pool = shuffle(partnerships.map((_,i)=>i));
    const courtsArr = [];
    let c=1;
    while(pool.length>=2){
      const i = pool.shift();
      pool.sort((x,y)=> oppScore(partnerships[i],partnerships[x],opponentCount) - oppScore(partnerships[i],partnerships[y],opponentCount));
      const j = pool.shift();
      const team1 = partnerships[i], team2 = partnerships[j];
      team1.forEach(p1=> team2.forEach(p2=> opponentCount[pairKey(p1,p2)]++));
      courtsArr.push({court:c++, team1, team2});
    }
    pool.forEach(i=> sitOuts.push(...partnerships[i]));
    return {round: idx+1, sitOuts, courts: courtsArr};
  });
}

// Fallback for when there are more players than the available courts can hold at once —
// a perfect one-time-only pairing can't be guaranteed here, so this rotates fairly and
// minimizes repeats as best it can across the auto-calculated round count.
function buildGreedyRound(playerIds, usableCourts, capacity, format, partnerCount, opponentCount, sitOutCount){
  const key = pairKey;
  const numSitOut = playerIds.length - capacity;
  const order = [...playerIds].sort((a,b)=> sitOutCount[a]-sitOutCount[b] || (Math.random()-0.5));
  const sitOuts = numSitOut>0 ? order.slice(0, numSitOut) : [];
  sitOuts.forEach(id=> sitOutCount[id]++);
  let pool = shuffle(playerIds.filter(id=> !sitOuts.includes(id)));
  const courtsArr = [];
  for(let c=1; c<=usableCourts; c++){
    if(pool.length < (format==='singles'?2:4)) break;
    if(format==='singles'){
      const a = pool.shift();
      pool.sort((x,y)=> opponentCount[key(a,x)]-opponentCount[key(a,y)]);
      const b = pool.shift();
      opponentCount[key(a,b)]++;
      courtsArr.push({court:c, team1:[a], team2:[b]});
    } else {
      const a = pool.shift();
      pool.sort((x,y)=> partnerCount[key(a,x)]-partnerCount[key(a,y)]);
      const b = pool.shift();
      partnerCount[key(a,b)]++;
      pool.sort((x,y)=>{
        const sx = opponentCount[key(a,x)]+opponentCount[key(b,x)];
        const sy = opponentCount[key(a,y)]+opponentCount[key(b,y)];
        return sx-sy;
      });
      const c1 = pool.shift();
      pool.sort((x,y)=>{
        const sx = partnerCount[key(c1,x)]*2 + opponentCount[key(a,x)] + opponentCount[key(b,x)];
        const sy = partnerCount[key(c1,y)]*2 + opponentCount[key(a,y)] + opponentCount[key(b,y)];
        return sx-sy;
      });
      const d1 = pool.shift();
      partnerCount[key(c1,d1)]++;
      [a,b].forEach(p1=> [c1,d1].forEach(p2=> opponentCount[key(p1,p2)]++));
      courtsArr.push({court:c, team1:[a,b], team2:[c1,d1]});
    }
  }
  return { sitOuts, courts: courtsArr };
}
function generateScheduleGreedy({playerIds, courts, format}){
  const rounds = autoRoundCount(playerIds.length);
  const capacityPerCourt = format==='singles' ? 2 : 4;
  const usableCourts = Math.max(1, Math.min(courts, Math.floor(playerIds.length/capacityPerCourt)));
  const capacity = usableCourts*capacityPerCourt;
  const sitOutCount = {}; playerIds.forEach(id=> sitOutCount[id]=0);
  const partnerCount = {}, opponentCount = {};
  playerIds.forEach(a=> playerIds.forEach(b=>{ if(a!==b){ partnerCount[pairKey(a,b)]=0; opponentCount[pairKey(a,b)]=0; } }));
  const roundsOut = [];
  for(let r=1; r<=rounds; r++){
    const { sitOuts, courts:courtsArr } = buildGreedyRound(playerIds, usableCourts, capacity, format, partnerCount, opponentCount, sitOutCount);
    roundsOut.push({round:r, sitOuts, courts:courtsArr});
  }
  return roundsOut;
}

function generateSchedule({playerIds, courts, format}){
  const capacityPerCourt = format==='singles' ? 2 : 4;
  const fitsEveryRound = playerIds.length <= Math.max(1,courts)*capacityPerCourt;
  return fitsEveryRound
    ? generateScheduleRoundRobin({playerIds, format})
    : generateScheduleGreedy({playerIds, courts, format});
}

/* ============================= ACTIONS ============================= */
function openAuthModal(mode){ state.showAuthModal=true; state.authMode=mode||'login'; render(); }
function closeAuthModal(){ state.showAuthModal=false; render(); }
async function submitAuthForm(ev){
  ev.preventDefault();
  const mode = state.authMode;
  const email = document.getElementById('auth_email').value.trim();
  const password = document.getElementById('auth_password').value;
  const name = mode==='register' ? document.getElementById('auth_name').value.trim() : null;
  if(!email || !password){ toast('Enter email and password'); return; }
  if(mode==='register' && !name){ toast('Enter your player name'); return; }
  state.authBusy = true; render();
  try{
    if(mode==='register'){
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      // Link to an existing unclaimed roster entry with a matching name if one exists,
      // so an admin-added player's history isn't duplicated when they register.
      const existing = state.players.find(p=> !p.ownerUid && p.name.trim().toLowerCase()===name.toLowerCase());
      let playerId;
      if(existing){
        playerId = existing.id;
        await PLAYERS_COL.doc(playerId).update({ ownerUid: cred.user.uid });
      } else {
        playerId = uid('pl');
        await PLAYERS_COL.doc(playerId).set({ id:playerId, name, guest:false, createdAt:new Date().toISOString(), ownerUid:cred.user.uid });
      }
      await USERS_COL.doc(cred.user.uid).set({ displayName:name, email, role:'player', playerId, createdAt:new Date().toISOString() });
      toast(`Welcome to the club, ${name}!`);
    } else {
      await auth.signInWithEmailAndPassword(email, password);
      toast('Signed in');
    }
    state.showAuthModal = false;
  }catch(e){
    toast(e.message ? e.message.replace('Firebase: ','') : 'Something went wrong');
  }
  state.authBusy = false;
  render();
}
async function logoutUser(){
  await auth.signOut();
  toast('Signed out');
}
function avatarHTML(player, size){
  size = size || 40;
  const initial = player && player.name ? player.name.trim().charAt(0).toUpperCase() : '?';
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:var(--court);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:${Math.round(size*0.45)}px;flex-shrink:0;">${initial}</div>`;
}
async function addPlayer(name, guest){
  name = name.trim();
  if(!name) return null;
  const p = { id: uid('pl'), name, guest: !!guest, createdAt: new Date().toISOString() };
  if(guest && state.currentUser) p.createdByUid = state.currentUser.uid;
  try{ await PLAYERS_COL.doc(p.id).set(p); }
  catch(e){ toast('Could not save — check your connection'); return null; }
  return p;
}
async function deletePlayer(id){
  if(!isAdmin()){ toast('Only admins can remove players'); return; }

function updateScheduleDraft(field, value, rerender){
  if(!state.scheduleDraft) state.scheduleDraft=defaultScheduleDraft();
  if(['courts','durationMinutes','avgGameMinutes'].includes(field)) value=Math.max(1,parseInt(value,10)||1);
  state.scheduleDraft[field]=value;
  if(field==='mode'){
    state.tournamentTeams=null;
    state.tournamentLeftover=null;
  }
  if(field==='format'){
    state.tournamentTeams=null;
    state.tournamentLeftover=null;
    if(value==='singles'){
      state.scheduleDraft.duprT1b='';
      state.scheduleDraft.duprT2b='';
    }
  }
  if(rerender!==false) render();
}

function autoPairTeams(){
  const ids=shuffle(Array.from(state.scheduleSelection));
  if(ids.length<4){ toast('Pick at least 4 players to form two teams'); return; }
  const teams=[];
  for(let i=0;i+1<ids.length;i+=2) teams.push([ids[i],ids[i+1]]);
  state.tournamentTeams=teams;
  state.tournamentLeftover=ids.length%2===1 ? ids[ids.length-1] : null;
  render();
}
function duprSelectedIds(draft){
  if(!draft) return [];
  const ids=draft.format==='singles'
    ? [draft.duprT1a,draft.duprT2a]
    : [draft.duprT1a,draft.duprT1b,draft.duprT2a,draft.duprT2b];
  return ids.filter(Boolean);
}
function sessionRoundTarget(draft){
  const duration=Math.max(1,Number(draft.durationMinutes)||120);
  const avg=Math.max(1,Number(draft.avgGameMinutes)||15);
  return Math.max(1,Math.floor(duration/avg));
}
function buildOpenRoundsForDraft(playerIds,draft){
  const target=sessionRoundTarget(draft);
  let rounds=generateSchedule({playerIds,courts:draft.courts,format:draft.format});
  if(rounds.length>target) return rounds.slice(0,target).map((r,i)=>({...r,round:i+1}));
  rounds=rounds.map((r,i)=>({...r,round:i+1}));
  while(rounds.length<target){
    const temp={rounds,courts:draft.courts,format:draft.format};
    const {playerIds:ids,partnerCount,opponentCount,sitOutCount}=deriveCountsFromSchedule(temp);
    const capacityPerCourt=draft.format==='singles'?2:4;
    const usableCourts=Math.max(1,Math.min(draft.courts,Math.floor(ids.length/capacityPerCourt)));
    const capacity=usableCourts*capacityPerCourt;
    const next=buildGreedyRound(ids,usableCourts,capacity,draft.format,partnerCount,opponentCount,sitOutCount);
    rounds.push({round:rounds.length+1,sitOuts:next.sitOuts,courts:next.courts});
  }
  return rounds;
}
function buildTournamentRoundsFromTeams(teams,courts,leftover){
  if(!Array.isArray(teams)||teams.length<2) return [];
  const tokens=teams.map((_,i)=>`t${i}`);
  const byToken={}; teams.forEach((team,i)=>byToken[`t${i}`]=team);
  const allPlayerIds=teams.flat();
  const blocks=[];
  buildCircleRounds(tokens).forEach(pairRound=>{
    const matches=[];
    pairRound.forEach(([a,b])=>{
      if(isBye(a)&&isBye(b)) return;
      if(isBye(a)||isBye(b)) return;
      matches.push({team1:byToken[a],team2:byToken[b]});
    });
    for(let i=0;i<matches.length;i+=Math.max(1,courts)){
      const chunk=matches.slice(i,i+Math.max(1,courts));
      const playing=new Set(chunk.flatMap(m=>[...m.team1,...m.team2]));
      const sitOuts=allPlayerIds.filter(id=>!playing.has(id));
      if(leftover) sitOuts.push(leftover);
      blocks.push({
        round:blocks.length+1,
        sitOuts:[...new Set(sitOuts)],
        courts:chunk.map((m,idx)=>({court:idx+1,team1:m.team1,team2:m.team2}))
      });
    }
  });
  return blocks;
}
function buildTournamentForDraft(draft){
  if(draft.format==='singles'){
    const teams=Array.from(state.scheduleSelection).map(id=>[id]);
    return {rounds:buildTournamentRoundsFromTeams(teams,draft.courts,null),teams:null,leftover:null,selectedPlayerIds:teams.flat()};
  }
  const teams=state.tournamentTeams||[];
  return {rounds:buildTournamentRoundsFromTeams(teams,draft.courts,state.tournamentLeftover),teams,leftover:state.tournamentLeftover||null,selectedPlayerIds:teams.flat().concat(state.tournamentLeftover?[state.tournamentLeftover]:[])};
}
function buildDuprForDraft(draft){
  const team1=draft.format==='singles'?[draft.duprT1a]:[draft.duprT1a,draft.duprT1b];
  const team2=draft.format==='singles'?[draft.duprT2a]:[draft.duprT2a,draft.duprT2b];
  return {rounds:[{round:1,sitOuts:[],courts:[{court:1,team1,team2}]}],selectedPlayerIds:[...team1,...team2]};
}
function scheduleStructureSignature({mode,format,courts,durationMinutes,avgGameMinutes,selectedPlayerIds,teams,rounds}){
  const effectiveCourts=mode==='dupr'?1:(Number(courts)||1);
  const duprGames=mode==='dupr'?(rounds||[]).flatMap(rd=>(rd.courts||[]).map(ct=>({
    team1:[...(ct.team1||[])],team2:[...(ct.team2||[])]
  }))):null;
  return JSON.stringify({
    mode,format,courts:effectiveCourts,
    timing:mode==='open'?[Math.max(1,Number(durationMinutes)||120),Math.max(1,Number(avgGameMinutes)||15)]:null,
    players:[...new Set(selectedPlayerIds||[])].sort(),
    teams:Array.isArray(teams)?teams.map(t=>[...t].sort()).sort((a,b)=>a.join('|').localeCompare(b.join('|'))):null,
    duprGames
  });
}
async function saveGamePlan(){
  if(!isSignedIn()){ toast('Sign in to create a Game Plan'); return; }
  const draft=state.scheduleDraft||defaultScheduleDraft();
  if(!draft.date){ toast('Choose a game day'); return; }
  if(!draft.startTime){ toast('Choose a start time'); return; }

  let rounds=[],selectedPlayerIds=[],teams=null,leftover=null;
  if(draft.mode==='open'){
    selectedPlayerIds=Array.from(state.scheduleSelection);
    const min=draft.format==='singles'?2:4;
    if(selectedPlayerIds.length<min){ toast(`Pick at least ${min} players`); return; }
    rounds=buildOpenRoundsForDraft(selectedPlayerIds,draft);
  } else if(draft.mode==='tournament'){
    if(draft.format==='singles' && state.scheduleSelection.size<2){ toast('Pick at least 2 players'); return; }
    if(draft.format==='doubles'){
      if(!state.tournamentTeams || state.tournamentTeams.length<2){ toast('Pair up at least two teams first'); return; }
      if(state.tournamentLeftover){ toast('Tournament doubles needs an even number of players'); return; }
    }
    const built=buildTournamentForDraft(draft);
    rounds=built.rounds; selectedPlayerIds=built.selectedPlayerIds; teams=built.teams; leftover=built.leftover;
  } else {
    const expected=draft.format==='singles'?2:4;
    const ids=duprSelectedIds(draft);
    if(ids.length!==expected){ toast('Pick every DUPR player'); return; }
    if(new Set(ids).size!==ids.length){ toast("A player can't be picked twice"); return; }
    const built=buildDuprForDraft(draft);
    rounds=built.rounds; selectedPlayerIds=built.selectedPlayerIds;
  }
  if(!rounds.length){ toast('Could not build this Game Plan'); return; }

  const existing=state.scheduleScreen==='edit' ? scheduleById(state.activeScheduleId) : null;
  if(draft.date<todayStr() && (!existing || existing.date!==draft.date)){
    toast('Choose today or a future date for a new or rescheduled Game Plan');
    return;
  }
  // A DUPR plan may contain several manually appended matches. Editing the first
  // matchup or metadata must not silently discard the remaining courts.
  if(existing && existing.mode==='dupr' && draft.mode==='dupr' && existing.format===draft.format){
    const existingRound=(existing.rounds&&existing.rounds[0])||{round:1,sitOuts:[],courts:[]};
    const nextFirst=rounds[0].courts[0];
    const remaining=(existingRound.courts||[]).slice(1);
    rounds=[{...existingRound,round:1,courts:[nextFirst,...remaining]}];
    selectedPlayerIds=schedulePlayers({rounds});
  }
  if(existing && !canManageSchedule(existing)){ toast('Only the owner or an admin can save these changes'); return; }
  const effectiveCourts=draft.mode==='dupr'?1:Math.max(1,Number(draft.courts)||1);
  const nextSignature=scheduleStructureSignature({mode:draft.mode,format:draft.format,courts:effectiveCourts,durationMinutes:draft.durationMinutes,avgGameMinutes:draft.avgGameMinutes,selectedPlayerIds,teams,rounds});
  const oldSignature=existing ? scheduleStructureSignature({mode:existing.mode,format:existing.format,courts:existing.courts,durationMinutes:existing.durationMinutes,avgGameMinutes:existing.avgGameMinutes,selectedPlayerIds:schedulePlayers(existing),teams:existing.teams,rounds:existing.rounds}) : null;
  const structureChanged=!existing || nextSignature!==oldSignature;
  const dateChanged=!!(existing && existing.date!==draft.date);
  const hasRecorded=!!(existing && Object.keys(existing.recorded||{}).length);
  if(existing && hasRecorded && (structureChanged||dateChanged)){
    if(!confirm('This Game Plan already has recorded results. Saving structural or date changes will keep official match records in History, but disconnect the old Saved badges from this plan. Continue?')) return;
  }

  const docRef=existing ? SCHEDULES_COL.doc(scheduleDocId(existing)) : SCHEDULES_COL.doc();
  const now=new Date().toISOString();
  const preserveRounds=!!(existing && !structureChanged);
  const data={
    id:existing ? (existing.id||docRef.id) : docRef.id,
    title:String(draft.title||'').trim(),
    date:draft.date,
    startTime:draft.startTime,
    mode:draft.mode,
    format:draft.format,
    courts:effectiveCourts,
    durationMinutes:Math.max(1,Number(draft.durationMinutes)||120),
    avgGameMinutes:Math.max(1,Number(draft.avgGameMinutes)||15),
    selectedPlayerIds:[...new Set(selectedPlayerIds)],
    numberOfRounds:preserveRounds ? scheduleRoundCount(existing) : rounds.length,
    status:existing ? (existing.status||'published') : 'published',
    rounds:preserveRounds ? existing.rounds : rounds,
    recorded:(existing && !structureChanged && !dateChanged) ? (existing.recorded||{}) : {},
    teams:draft.mode==='tournament' ? (preserveRounds ? (existing.teams||teams) : teams) : null,
    leftover:draft.mode==='tournament' ? (preserveRounds ? (existing.leftover||null) : leftover) : null,
    createdBy:existing ? existing.createdBy : state.currentUser.uid,
    creatorName:existing ? (existing.creatorName||currentCreatorName()) : currentCreatorName(),
    createdAt:existing ? (existing.createdAt||now) : now,
    updatedAt:now
  };
  try{ await docRef.set(data); }
  catch(e){ console.error(e); toast('Could not save the Game Plan — check your connection'); return; }
  upsertScheduleLocal(docRef.id,data);
  state.activeScheduleId=docRef.id;
  state.scheduleScreen='view';
  state.scheduleDraft=null;
  toast(existing?'Game Plan updated':'Game Plan created');
  render();
}
async function deleteGamePlan(id){
  const sch=scheduleById(id);
  if(!sch) return;
  if(!canManageSchedule(sch)){ toast('Only the owner or an admin can delete this Game Plan'); return; }
  const hasRecorded=Object.keys(sch.recorded||{}).length>0;
  const msg=hasRecorded
    ? 'Delete this Game Plan? Official match records already saved in History will remain.'
    : 'Delete this Game Plan? This cannot be undone.';
  if(!confirm(msg)) return;
  try{ await SCHEDULES_COL.doc(scheduleDocId(sch)).delete(); }
  catch(e){ console.error(e); toast('Could not delete the Game Plan'); return; }
  state.schedules=state.schedules.filter(s=>scheduleDocId(s)!==scheduleDocId(sch));
  backToScheduleList();
  toast('Game Plan deleted');
}
async function addDuprMatchToPlan(id){
  const sch=scheduleById(id);
  if(!sch||sch.mode!=='dupr') return;
  if(!canManageSchedule(sch)){ toast('Only the owner or an admin can add matches'); return; }
  const format=sch.format;
  const t1a=document.getElementById('dupr_more_t1a').value;
  const t1b=format==='doubles'?document.getElementById('dupr_more_t1b').value:null;
  const t2a=document.getElementById('dupr_more_t2a').value;
  const t2b=format==='doubles'?document.getElementById('dupr_more_t2b').value:null;
  const team1=format==='doubles'?[t1a,t1b]:[t1a];
  const team2=format==='doubles'?[t2a,t2b]:[t2a];
  const all=[...team1,...team2];
  if(all.some(x=>!x)){ toast('Pick all players first'); return; }
  if(new Set(all).size!==all.length){ toast("A player can't be picked twice"); return; }
  const baseRound=(sch.rounds&&sch.rounds[0])||{round:1,sitOuts:[],courts:[]};
  const nextCourt=(baseRound.courts||[]).length+1;
  const updated={
    ...stripScheduleMeta(sch),
    rounds:[{...baseRound,courts:[...(baseRound.courts||[]),{court:nextCourt,team1,team2}]}],
    selectedPlayerIds:[...new Set([...schedulePlayers(sch),...all])],
    numberOfRounds:1,
    updatedAt:new Date().toISOString()
  };
  try{ await SCHEDULES_COL.doc(scheduleDocId(sch)).set(updated); }
  catch(e){ console.error(e); toast('Could not add the match'); return; }
  upsertScheduleLocal(scheduleDocId(sch),updated);
  toast('DUPR match added');
  render();
}
async function recordCourtResult(scheduleId,round,court){
  const sch=scheduleById(scheduleId);
  if(!sch) return;
  if(!canManageSchedule(sch)){ toast(`Only ${sch.creatorName||'the creator'} or an admin can record results`); return; }
  const s1=parseInt(document.getElementById(`res_${round}_${court}_1`).value,10);
  const s2=parseInt(document.getElementById(`res_${round}_${court}_2`).value,10);
  if(isNaN(s1)||isNaN(s2)){ toast('Enter both scores'); return; }
  const rd=(sch.rounds||[]).find(r=>r.round===round);
  const ct=rd && (rd.courts||[]).find(c=>c.court===court);
  if(!ct){ toast('This court could not be found'); return; }
  const matchId=uid('m');
  const m={
    id:matchId,scheduleId:scheduleDocId(sch),date:sch.date,startTime:sch.startTime||'',court:String(ct.court),
    format:sch.format,mode:sch.mode||'open',team1:ct.team1,team2:ct.team2,score1:s1,score2:s2,
    round,status:'completed',recordedByUid:state.currentUser.uid,createdAt:new Date().toISOString()
  };
  const recorded={...(sch.recorded||{}),[`${round}_${court}`]:matchId};
  const updated={...stripScheduleMeta(sch),recorded,updatedAt:new Date().toISOString()};
  try{
    const matchRef=MATCHES_COL.doc(matchId);
    const scheduleRef=SCHEDULES_COL.doc(scheduleDocId(sch));
    if(typeof db.batch==='function'){
      const batch=db.batch();
      batch.set(matchRef,m);
      batch.set(scheduleRef,updated);
      await batch.commit();
    }else{
      // Deterministic fallback for lightweight environments; production Firebase uses the batch above.
      await matchRef.set(m);
      await scheduleRef.set(updated);
    }
  }catch(e){ console.error(e); toast('Could not save the result'); return; }
  upsertScheduleLocal(scheduleDocId(sch),updated);
  toast(`Court ${court} result saved`);
  render();
}
function deriveCountsFromSchedule(sch){
  const playerIds=Array.from(new Set((sch.rounds||[]).flatMap(rd=>[
    ...(rd.courts||[]).flatMap(c=>[...(c.team1||[]),...(c.team2||[])]),
    ...(rd.sitOuts||[])
  ])));
  const partnerCount={},opponentCount={},sitOutCount={};
  playerIds.forEach(a=>{ sitOutCount[a]=0; playerIds.forEach(b=>{ if(a!==b){ partnerCount[pairKey(a,b)]=0; opponentCount[pairKey(a,b)]=0; } }); });
  (sch.rounds||[]).forEach(rd=>{
    (rd.sitOuts||[]).forEach(id=>sitOutCount[id]=(sitOutCount[id]||0)+1);
    (rd.courts||[]).forEach(ct=>{
      if(ct.team1.length===2) partnerCount[pairKey(ct.team1[0],ct.team1[1])]++;
      if(ct.team2.length===2) partnerCount[pairKey(ct.team2[0],ct.team2[1])]++;
      ct.team1.forEach(p1=>ct.team2.forEach(p2=>opponentCount[pairKey(p1,p2)]++));
    });
  });
  return {playerIds,partnerCount,opponentCount,sitOutCount};
}
async function addExtraRound(scheduleId){
  const sch=scheduleById(scheduleId);
  if(!sch) return;
  if(!canManageSchedule(sch)){ toast('Only the owner or an admin can add rounds'); return; }
  const nextRoundNum=scheduleRoundCount(sch)+1;
  let newRound;
  if(sch.mode==='tournament'){
    const teams=sch.teams&&sch.teams.length ? sch.teams : schedulePlayers(sch).map(id=>[id]);
    const templates=buildTournamentRoundsFromTeams(teams,sch.courts,sch.leftover||null);
    if(!templates.length){ toast('Could not build another tournament round'); return; }
    const t=templates[(scheduleRoundCount(sch))%templates.length];
    newRound={...t,round:nextRoundNum,courts:t.courts.map(c=>({...c}))};
  }else{
    const {playerIds,partnerCount,opponentCount,sitOutCount}=deriveCountsFromSchedule(sch);
    const capacityPerCourt=sch.format==='singles'?2:4;
    const usableCourts=Math.max(1,Math.min(sch.courts,Math.floor(playerIds.length/capacityPerCourt)));
    const capacity=usableCourts*capacityPerCourt;
    const next=buildGreedyRound(playerIds,usableCourts,capacity,sch.format,partnerCount,opponentCount,sitOutCount);
    newRound={round:nextRoundNum,sitOuts:next.sitOuts,courts:next.courts};
  }
  const updated={...stripScheduleMeta(sch),rounds:[...(sch.rounds||[]),newRound],numberOfRounds:nextRoundNum,updatedAt:new Date().toISOString()};
  try{ await SCHEDULES_COL.doc(scheduleDocId(sch)).set(updated); }
  catch(e){ console.error(e); toast('Could not add another round'); return; }
  upsertScheduleLocal(scheduleDocId(sch),updated);
  toast('Added another round');
  render();
}

function computeTeamStandings(sch){
  if(!sch.teams) return null;
  const keyOf=arr=>[...arr].sort().join('|');
  const table=sch.teams.map(t=>({team:t,key:keyOf(t),wins:0,losses:0,diff:0,games:0}));
  const byKey={}; table.forEach(row=>byKey[row.key]=row);
  const recordedIds=new Set(Object.values(sch.recorded||{}));
  // The schedule's recorded map is the authoritative link. This prevents
  // results from another Game Plan on the same date from entering standings.
  const relevant=state.matches.filter(m=>recordedIds.has(m.id));
  relevant.filter(m=>m.mode==='tournament').forEach(m=>{
    const k1=keyOf(m.team1),k2=keyOf(m.team2);
    if(byKey[k1]){ byKey[k1].games++; byKey[k1].diff+=(m.score1-m.score2); if(m.score1>m.score2) byKey[k1].wins++; else if(m.score1<m.score2) byKey[k1].losses++; }
    if(byKey[k2]){ byKey[k2].games++; byKey[k2].diff+=(m.score2-m.score1); if(m.score2>m.score1) byKey[k2].wins++; else if(m.score2<m.score1) byKey[k2].losses++; }
  });
  return table.sort((a,b)=>b.wins-a.wins||b.diff-a.diff);
}

  const opts=value=>`<option value="">Select…</option>${roster.map(p=>`<option value="${p.id}" ${value===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}`;

        ${draft.format==='doubles'?`<div class="field"><label>Team 2 — Player B</label><select onchange="updateScheduleDraft('duprT2b',this.value,false)">${opts(draft.duprT2b)}</select></div>`:''}

}
function gamePlanPreview(draft){
  let players=0,rounds=0,games=0,perPlayer=0;
  if(draft.mode==='open'){
    players=state.scheduleSelection.size;
    rounds=sessionRoundTarget(draft);
    const perCourt=draft.format==='singles'?2:4;
    const usable=Math.max(0,Math.min(draft.courts,Math.floor(players/perCourt)));
    games=usable*rounds;
    perPlayer=players?games*perCourt/players:0;
  }else if(draft.mode==='tournament'){
    const built=buildTournamentForDraft(draft);
    players=built.selectedPlayerIds.length;
    rounds=built.rounds.length;
    games=built.rounds.reduce((n,r)=>n+r.courts.length,0);
    perPlayer=players?games*(draft.format==='singles'?2:4)/players:0;
  }else{
    players=duprSelectedIds(draft).length;
    rounds=1; games=1; perPlayer=1;
  }
  const estimatedFinish=addMinutesToTime(draft.startTime,rounds*Math.max(1,Number(draft.avgGameMinutes)||15));
  return {players,rounds,games,perPlayer,estimatedFinish};
}

          <button class="btn btn-primary" type="button" onclick="saveGamePlan()">${isEdit?'Save changes':'Generate Game Plan'}</button>

/* ============================= SCHEDULE ============================= */
function filteredGamePlans(){
  const today=todayStr();
  let plans=state.schedules.filter(s=>s.status!=='cancelled' && (s.status!=='draft' || canManageSchedule(s)));
  if(state.scheduleFilter==='today') plans=plans.filter(s=>s.date===today);
  else if(state.scheduleFilter==='upcoming') plans=plans.filter(s=>s.date>today);
  else plans=state.currentUser ? plans.filter(s=>s.createdBy===state.currentUser.uid) : [];
  if(state.scheduleFilter==='mine'){
    return plans.sort((a,b)=>{
      const aFuture=a.date>=today?0:1,bFuture=b.date>=today?0:1;
      if(aFuture!==bFuture) return aFuture-bFuture;
      return aFuture===0 ? scheduleSortValue(a).localeCompare(scheduleSortValue(b)) : scheduleSortValue(b).localeCompare(scheduleSortValue(a));
    });
  }
  return plans.sort((a,b)=>scheduleSortValue(a).localeCompare(scheduleSortValue(b)));
}

  return `
  <article class="game-plan-card">
    <div class="game-plan-card-top">
      <div>
        <div class="game-plan-date">${fmtDate(sch.date)}</div>
        <div class="game-plan-time">${formatTime(sch.startTime)}</div>
      </div>

    </div>
    <div>
      <span class="mode-badge">${esc(mode.short)}</span>
      <div class="game-plan-title" style="margin-top:10px;">${title}</div>

function renderScheduleLanding(){

    <div class="schedule-page-head">
      <div>
        <div class="eyebrow">Club court rotation</div>
        <h1>Schedule</h1>
        <p class="small muted">Browse published Game Plans first. The creator selects a fixed participant list—there are no join, leave, RSVP, or waitlist controls.</p>
      </div>
      ${isSignedIn()?`<button class="btn btn-primary" onclick="openCreateGamePlan()">+ Create Game Plan</button>`:`<button class="btn btn-ghost" onclick="openAuthModal('login')">Sign in to create</button>`}
    </div>
    <div class="schedule-filters" style="margin-top:18px;">
      <button class="schedule-filter ${state.scheduleFilter==='today'?'active':''}" onclick="setScheduleFilter('today')">Today</button>
      <button class="schedule-filter ${state.scheduleFilter==='upcoming'?'active':''}" onclick="setScheduleFilter('upcoming')">Upcoming</button>

    <div class="section-title"><h2>${heading}</h2><span class="small muted">${plans.length} plan${plans.length===1?'':'s'}</span></div>
    ${state.scheduleFilter==='mine'&&!isSignedIn()?`<div class="empty"><h3>Sign in to see your Game Plans</h3><p>My Created only shows plans owned by the current account.</p><button class="btn btn-ball" onclick="openAuthModal('login')">Sign in</button></div>`:
      plans.length?`<div class="game-plan-grid">${plans.map(renderGamePlanCard).join('')}</div>`:
      `<div class="empty"><h3>No ${state.scheduleFilter==='today'?'Game Plans today':state.scheduleFilter==='upcoming'?'upcoming Game Plans':'Game Plans created by you'}</h3><p>${isSignedIn()?'Create a Game Plan and select the players who are attending.':'Sign in to create the club’s next court rotation.'}</p>${isSignedIn()?`<button class="btn btn-ball" onclick="openCreateGamePlan()">+ Create Game Plan</button>`:''}</div>`}
  </div>`;
}
function renderScheduleView(sch){
  const id=scheduleDocId(sch);
  const players=schedulePlayers(sch);
  const mode=MODE_META[sch.mode]||{label:sch.mode||'Game Plan',short:sch.mode||'Plan'};
  const canManage=canManageSchedule(sch);
  return `
  <div class="panel">
    <div class="schedule-page-head">
      <div>
        <button class="link-btn" onclick="backToScheduleList()">&larr; Back to Schedule</button>
        <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:12px;"><span class="mode-badge">${esc(mode.short)}</span><span class="status-badge ${esc(sch.status||'published')}">${esc((sch.status||'published').replace('_',' '))}</span></div>
        <h1 style="margin-top:10px;">${esc(sch.title||`${sch.creatorName||'Club'}'s ${mode.label}`)}</h1>
        <p class="small muted">${fmtDate(sch.date)} · ${formatTime(sch.startTime)} · Game Plan by ${esc(sch.creatorName||'Club player')}</p>
      </div>
      ${canManage?`<div class="game-plan-actions"><button class="btn btn-ghost btn-sm" onclick="editGamePlan(${jsArg(id)})">Edit</button><button class="btn btn-danger btn-sm" onclick="deleteGamePlan(${jsArg(id)})">Delete</button></div>`:''}
    </div>
    <div class="plan-summary">
      <div class="plan-summary-item"><strong>${players.length}</strong><span>Players</span></div>
      <div class="plan-summary-item"><strong>${sch.courts||1}</strong><span>Courts</span></div>
      <div class="plan-summary-item"><strong>${scheduleRoundCount(sch)}</strong><span>Rounds</span></div>
      <div class="plan-summary-item"><strong>${scheduleGameCount(sch)}</strong><span>Games</span></div>
    </div>
    <div class="divider"></div>
    <div class="eyebrow">Playing</div>
    <div class="participant-list">${players.map(pid=>`<span class="participant-pill">${esc(playerName(pid))}</span>`).join('')||'<span class="small muted">No players listed.</span>'}</div>
  </div>
  ${sch.mode==='dupr'&&canManage?renderDuprAppendForm(sch):''}
  ${renderScheduleResult(sch)}
  ${canManage&&sch.mode!=='dupr'?`<div class="panel"><div class="game-plan-actions"><button class="btn btn-ball" onclick="addExtraRound(${jsArg(id)})">+ Add Round</button></div><p class="small muted" style="margin:8px 0 0;">Manual + Add Game controls are reserved for the dedicated Scheduler phase; this keeps Phase 3 focused on the Game Plan foundation.</p></div>`:''}`;
}
function renderSchedule(){
  if(state.scheduleScreen==='create') return renderGamePlanBuilder(false);
  if(state.scheduleScreen==='edit'){
    const sch=scheduleById(state.activeScheduleId);
    if(!sch){ state.scheduleScreen='list'; return renderScheduleLanding(); }
    return renderGamePlanBuilder(true);
  }
  if(state.scheduleScreen==='view'){
    const sch=scheduleById(state.activeScheduleId);
    if(!sch){ state.scheduleScreen='list'; return renderScheduleLanding(); }
    return renderScheduleView(sch);
  }
  return renderScheduleLanding();
}
function renderScheduleResult(sch){
  const rounds=Array.isArray(sch.rounds)?sch.rounds:[];
  const totalSlots=scheduleGameCount(sch);
  const recordedCount=Object.values(sch.recorded||{}).filter(id=>state.matches.some(m=>m.id===id)).length;
  const complete=totalSlots>0&&recordedCount>=totalSlots;
  const standings=sch.mode==='tournament'?computeTeamStandings(sch):null;
  const canManage=canManageSchedule(sch);
  const id=scheduleDocId(sch);
  return `
  <div class="panel">
    <div class="section-title"><h2>All Courts</h2>${totalSlots?`<span class="diff-pill ${complete?'diff-pos':'diff-zero'}">${recordedCount}/${totalSlots} results recorded</span>`:''}</div>
    ${totalSlots===0?`<p class="small muted">No games have been added to this Game Plan.</p>`:''}
    ${standings&&standings.length?`
      <div class="eyebrow" style="margin-top:6px;">Standings</div>
      <table style="margin-bottom:6px;"><thead><tr><th>Team</th><th>W&nbsp;-&nbsp;L</th><th>+/-</th></tr></thead><tbody>
      ${standings.map(row=>`<tr><td class="name-cell">${row.team.map(playerName).map(esc).join(' &amp; ')}</td><td class="mono">${row.wins}-${row.losses}</td><td>${diffPill(row.diff,0)}</td></tr>`).join('')}
      </tbody></table>`:''}
    ${rounds.map(rd=>(rd.courts||[]).length===0?'':`
      <div class="round-label">${paddleSVG('var(--court)')} ${sch.mode==='dupr'?'Matches':'Round '+rd.round}</div>
      <div class="court-grid">
        ${(rd.courts||[]).map(ct=>{
          const recKey=`${rd.round}_${ct.court}`;
          const recordedId=(sch.recorded||{})[recKey];
          const recordedMatch=recordedId?state.matches.find(m=>m.id===recordedId):null;
          return `<div class="court-card">
            <div class="court-head"><span>${sch.mode==='dupr'?'MATCH '+ct.court:'COURT '+ct.court}</span>${recordedMatch?`<span class="recorded-badge">Saved</span>`:''}</div>
            <div class="court-body">
              <div class="team-row">${paddleSVG('#fff')} ${(ct.team1||[]).map(playerName).map(esc).join(' &amp; ')}</div>
              <div class="net-line">net</div>
              <div class="team-row">${paddleSVG('#fff')} ${(ct.team2||[]).map(playerName).map(esc).join(' &amp; ')}</div>
              ${recordedMatch?`<div class="score-inputs"><span style="color:#fff;font-family:'IBM Plex Mono',monospace;font-weight:700;">${recordedMatch.score1} <span class="score-vs">–</span> ${recordedMatch.score2}</span></div>`:
                canManage?`<div class="score-inputs"><input type="number" id="res_${rd.round}_${ct.court}_1" placeholder="0"/><span class="score-vs">VS</span><input type="number" id="res_${rd.round}_${ct.court}_2" placeholder="0"/><button class="btn btn-ball btn-sm" onclick="recordCourtResult(${jsArg(id)},${rd.round},${ct.court})">Save</button></div>`:
                `<div class="score-inputs"><span class="small" style="color:rgba(255,255,255,0.7);">Waiting for ${esc(sch.creatorName||'the creator')} to record this result</span></div>`}
            </div>
          </div>`;
        }).join('')}
      </div>
      ${(rd.sitOuts||[]).length?`<div style="margin-top:10px;"><div class="eyebrow">Sitting out this round</div><div class="paddle-stack">${rd.sitOuts.map((pid,i)=>`<div class="paddle-row"><span class="p-order">${i+1}</span>${paddleSVG('var(--court)')}<span class="p-name">${esc(playerName(pid))}</span></div>`).join('')}</div></div>`:''}
    `).join('')}
  </div>`;
}

/* ============================= HISTORY ============================= */
function renderHistory(){
  const ms = [...state.matches].sort((a,b)=> b.date.localeCompare(a.date) || 0);
  if(ms.length===0){
    return `<div class="panel"><div class="empty"><h3>No matches logged yet</h3><p>Games are recorded straight from the schedule generator — build today's rounds, then save each court's score as it wraps up.</p><button class="btn btn-ball" onclick="setTab('schedule')">Go to Schedule</button></div></div>`;
  }
  return `
  <div class="panel">
    <div class="section-title"><h2>Match history</h2><span class="small muted">${ms.length} game${ms.length>1?'s':''} logged</span></div>
    <table>
      <thead><tr><th>Date</th><th>Court</th><th>Team 1</th><th>Team 2</th><th>Score</th>${isAdmin() ? '<th></th>' : ''}</tr></thead>
      <tbody>
        ${ms.map(m=> `
          <tr>
            <td class="mono small">${fmtDate(m.date)}</td>
            <td class="mono small">${esc(m.court||'—')}</td>
            <td>${m.team1.map(playerName).map(esc).join(' &amp; ')}</td>
            <td>${m.team2.map(playerName).map(esc).join(' &amp; ')}</td>
            <td class="mono">${m.score1} – ${m.score2}</td>
            ${isAdmin() ? `<td><button class="btn btn-danger btn-sm" onclick="deleteMatch('${m.id}')">Delete</button></td>` : ''}
          </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}
